<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lectura de resultados TEST-ID OOD</title>
  <desc id="desc">Grafica con PPO, DQN y World Model en TEST-ID, OOD patron y OOD dificultad, mostrando nivel y caida.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">Leer una fila no es mirar una sola celda</text>
  <text class="body muted" x="48" y="88">Importa la nota absoluta y tambien cuanto cae al alejarse de lo conocido.</text>

  <rect x="78" y="136" width="750" height="438" rx="30" fill="#ffffff" stroke="#dbe2ea" class="shadow"/>
  <g transform="translate(148 196)">
    <line x1="0" y1="300" x2="560" y2="300" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#334155" stroke-width="2"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="0" y1="60" x2="560" y2="60"/><line x1="0" y1="120" x2="560" y2="120"/><line x1="0" y1="180" x2="560" y2="180"/><line x1="0" y1="240" x2="560" y2="240"/>
    </g>
    <text class="tiny muted" x="-20" y="5" text-anchor="end">100</text>
    <text class="tiny muted" x="-20" y="155" text-anchor="end">50</text>
    <text class="tiny muted" x="-20" y="305" text-anchor="end">0</text>
    <text class="tiny muted" x="0" y="330" text-anchor="middle">TEST-ID</text>
    <text class="tiny muted" x="280" y="330" text-anchor="middle">OOD-patron</text>
    <text class="tiny muted" x="560" y="330" text-anchor="middle">OOD-dificultad</text>
    <path d="M0,27 L280,33 L560,42" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <path d="M0,69 L280,78 L560,108" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
    <path d="M0,135 L280,141 L560,174" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <g fill="#2563eb"><circle cx="0" cy="27" r="8"/><circle cx="280" cy="33" r="8"/><circle cx="560" cy="42" r="8"/></g>
    <g fill="#059669"><circle cx="0" cy="69" r="8"/><circle cx="280" cy="78" r="8"/><circle cx="560" cy="108" r="8"/></g>
    <g fill="#f97316"><circle cx="0" cy="135" r="8"/><circle cx="280" cy="141" r="8"/><circle cx="560" cy="174" r="8"/></g>
    <text class="mono" x="586" y="46" fill="#2563eb">PPO 91-89-86</text>
    <text class="mono" x="586" y="112" fill="#059669">DQN 77-74-64</text>
    <text class="mono" x="586" y="178" fill="#f97316">WM 55-53-42</text>
  </g>

  <g transform="translate(874 164)">
    <rect width="244" height="134" rx="24" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <text class="tiny" x="32" y="40" fill="#1d4ed8">LECTURA 1</text>
    <text class="label ink" x="32" y="72">Nivel absoluto</text>
    <text class="small muted" x="32" y="104">PPO parte arriba:</text>
    <text class="small muted" x="32" y="124">mejor rendimiento.</text>
  </g>
  <g transform="translate(874 340)">
    <rect width="244" height="134" rx="24" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <text class="tiny" x="32" y="40" fill="#c2410c">LECTURA 2</text>
    <text class="label ink" x="32" y="72">Pendiente OOD</text>
    <text class="small muted" x="32" y="104">La caida mide cuanto</text>
    <text class="small muted" x="32" y="124">se aleja de memorizar.</text>
  </g>

  <rect x="230" y="626" width="740" height="48" rx="24" fill="#111827"/>
  <text class="body" x="600" y="657" text-anchor="middle" fill="#fff">Buena senal: nota alta y caida suave al pasar de TEST-ID a OOD.</text>
</svg>
