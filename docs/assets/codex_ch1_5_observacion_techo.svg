<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">La observacion como techo de informacion</title>
  <desc id="desc">Comparacion entre observacion ciega con seis cinematicos y observacion completa con matriz 8x10 y encoder convolucional.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:800 15px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">Muro 3: la red no puede decidir con informacion que no recibe</text>
  <text class="body muted" x="48" y="88">La mejora no es "mas neuronas"; es poner el mapa correcto en la entrada.</text>

  <g transform="translate(74 136)">
    <rect width="490" height="430" rx="24" fill="#fef2f2" stroke="#fecaca" class="shadow"/>
    <text class="tiny" x="34" y="44" fill="#dc2626">ANTES - OBSERVACION CIEGA</text>
    <text class="label ink" x="34" y="78">6 numeros cinematicos</text>
    <g transform="translate(48 116)">
      <rect width="394" height="86" rx="18" fill="#fff" stroke="#fecaca"/>
      <text class="mono" x="26" y="35" fill="#dc2626">x, y, vx, vy</text>
      <text class="mono" x="26" y="63" fill="#dc2626">x_pala, paso</text>
      <rect x="252" y="22" width="104" height="42" rx="21" fill="#fee2e2" stroke="#fca5a5"/>
      <text class="tiny" x="304" y="49" text-anchor="middle" fill="#dc2626">SIN MURO</text>
    </g>
    <g transform="translate(48 246)">
      <rect width="394" height="78" rx="18" fill="#fff" stroke="#fecaca"/>
      <text class="label" x="28" y="34" fill="#991b1b">Techo: no puede apuntar</text>
      <text class="small muted" x="28" y="60">0% en niveles dispersos.</text>
    </g>
    <text class="small muted" x="48" y="374">El 56% en muro lleno no era vision:</text>
    <text class="small muted" x="48" y="398">era fisica mas supervivencia.</text>
  </g>

  <g transform="translate(636 136)">
    <rect width="490" height="430" rx="24" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <text class="tiny" x="34" y="44" fill="#1d4ed8">DESPUES - OBSERVACION CON MAPA</text>
    <text class="label ink" x="34" y="78">6 cinematicos + matriz 8x10</text>
    <g transform="translate(58 122)">
      <rect width="220" height="176" rx="16" fill="#fff" stroke="#bfdbfe"/>
      <g transform="translate(28 28)">
        <rect width="16" height="16" fill="#2563eb"/><rect x="20" width="16" height="16" fill="#2563eb"/><rect x="40" width="16" height="16" fill="#2563eb"/><rect x="60" width="16" height="16" fill="#2563eb"/><rect x="80" width="16" height="16" fill="#2563eb"/><rect x="100" width="16" height="16" fill="#2563eb"/><rect x="120" width="16" height="16" fill="#2563eb"/><rect x="140" width="16" height="16" fill="#2563eb"/>
        <rect y="20" width="16" height="16" fill="#93c5fd"/><rect x="40" y="20" width="16" height="16" fill="#93c5fd"/><rect x="60" y="20" width="16" height="16" fill="#93c5fd"/><rect x="100" y="20" width="16" height="16" fill="#93c5fd"/><rect x="120" y="20" width="16" height="16" fill="#93c5fd"/>
        <rect x="20" y="40" width="16" height="16" fill="#60a5fa"/><rect x="60" y="40" width="16" height="16" fill="#60a5fa"/><rect x="80" y="40" width="16" height="16" fill="#60a5fa"/><rect x="140" y="40" width="16" height="16" fill="#60a5fa"/>
        <rect y="60" width="16" height="16" fill="#bfdbfe"/><rect x="40" y="60" width="16" height="16" fill="#bfdbfe"/><rect x="100" y="60" width="16" height="16" fill="#bfdbfe"/>
        <rect x="22" y="92" width="112" height="22" rx="11" fill="#111827"/>
        <circle cx="114" cy="82" r="9" fill="#ef4444"/>
      </g>
      <text class="tiny" x="110" y="154" text-anchor="middle" fill="#1d4ed8">80 celdas: 1 vivo, 0 hueco</text>
    </g>
    <g transform="translate(304 144)">
      <rect width="116" height="54" rx="16" fill="#fff" stroke="#bfdbfe"/>
      <text class="tiny" x="58" y="32" text-anchor="middle" fill="#1d4ed8">CONV</text>
      <text class="small muted" x="58" y="78" text-anchor="middle">respeta</text>
      <text class="small muted" x="58" y="100" text-anchor="middle">vecindad</text>
    </g>
    <g transform="translate(48 336)">
      <rect width="394" height="60" rx="18" fill="#fff" stroke="#bfdbfe"/>
      <text class="label" x="197" y="36" text-anchor="middle" fill="#1d4ed8">Ahora puede elegir a que ladrillo apuntar</text>
    </g>
  </g>

  <rect x="220" y="616" width="760" height="50" rx="25" fill="#111827"/>
  <text class="body" x="600" y="648" text-anchor="middle" fill="#fff">La observacion fija el techo: si el objetivo no entra, el algoritmo no lo inventa.</text>
</svg>
