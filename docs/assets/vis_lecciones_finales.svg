<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" style="width:100%;height:auto"><defs><marker id="ah-6b7280" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6b7280"/></marker><marker id="ah-2563eb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker><marker id="ah-0c9f6e" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0c9f6e"/></marker><marker id="ah-991b1b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#991b1b"/></marker><marker id="ah-b45309" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker><marker id="ah-6d28d9" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6d28d9"/></marker><marker id="ah-0e7490" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0e7490"/></marker><marker id="ah-dc2626" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker><marker id="ah-334155" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs><rect width="980" height="300" fill="#ffffff"/><text x="40" y="42" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#1f2937">Cuatro lecciones para llevarte</text><rect x="40" y="86" width="445" height="88" rx="12" fill="#f0fdf9" stroke="#0c9f6e" stroke-width="1.5"/><rect x="40" y="86" width="6" height="88" rx="0" fill="#0c9f6e" stroke="#0c9f6e" stroke-width="0"/><text x="62" y="114" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#0c9f6e">1 · Mide en lo NO visto</text><text x="62" y="134" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#1f2937">El éxito en niveles de entrenamiento no dice casi nada. El 91%</text><text x="62" y="150" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#1f2937">cuenta porque se midió fuera.</text><rect x="495" y="86" width="445" height="88" rx="12" fill="#eff4fe" stroke="#2563eb" stroke-width="1.5"/><rect x="495" y="86" width="6" height="88" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="517" y="114" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#2563eb">2 · Recompensa ≠ éxito</text><text x="517" y="134" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#1f2937">Una recompensa al alza puede convivir con 0% de niveles</text><text x="517" y="150" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#1f2937">limpiados. Mide el logro, no el proxy.</text><rect x="40" y="186" width="445" height="88" rx="12" fill="#f4effe" stroke="#6d28d9" stroke-width="1.5"/><rect x="40" y="186" width="6" height="88" rx="0" fill="#6d28d9" stroke="#6d28d9" stroke-width="0"/><text x="62" y="214" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#6d28d9">3 · La forma de los datos importa</text><text x="62" y="234" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#1f2937">Reloj, escala y convolución (la formulación) pesaron más que</text><text x="62" y="250" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#1f2937">cambiar de algoritmo.</text><rect x="495" y="186" width="445" height="88" rx="12" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/><rect x="495" y="186" width="6" height="88" rx="0" fill="#b45309" stroke="#b45309" stroke-width="0"/><text x="517" y="214" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#b45309">4 · A veces, quitar mejora</text><text x="517" y="234" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#1f2937">Quitar el shaping Φ subió +8. Más piezas no es mejor; las</text><text x="517" y="250" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#1f2937">correctas sí.</text></svg>