<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lo minimo para leer aprendizaje por refuerzo</title>
  <desc id="desc">Infografia con las cuatro piezas basicas antes de leer el bucle: estado, accion, recompensa y episodio.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">Lo minimo para leer RL sin perderte</text>
  <text class="body muted" x="48" y="88">Antes de hablar de redes o algoritmos, solo necesitas cuatro piezas del juego.</text>

  <g transform="translate(70 154)">
    <rect width="250" height="286" rx="28" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <circle cx="56" cy="54" r="24" fill="#2563eb"/>
    <text class="label" x="56" y="61" text-anchor="middle" fill="#fff">1</text>
    <text class="tiny" x="96" y="46" fill="#1d4ed8">LO QUE VE</text>
    <text class="label ink" x="96" y="76">Estado s</text>
    <text class="small muted" x="36" y="116">Una descripcion del instante:</text>
    <text class="small muted" x="36" y="138">bola, pala y ladrillos vivos.</text>
    <rect x="36" y="170" width="178" height="36" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
    <text class="mono" x="125" y="193" text-anchor="middle" fill="#1d4ed8">86 numeros</text>
    <text class="small muted" x="36" y="236">Si algo no esta en el estado,</text>
    <text class="small muted" x="36" y="258">el agente no puede usarlo.</text>
  </g>

  <g transform="translate(345 154)">
    <rect width="250" height="286" rx="28" fill="#ecfeff" stroke="#a5f3fc" class="shadow"/>
    <circle cx="56" cy="54" r="24" fill="#0891b2"/>
    <text class="label" x="56" y="61" text-anchor="middle" fill="#fff">2</text>
    <text class="tiny" x="96" y="46" fill="#0e7490">LO QUE HACE</text>
    <text class="label ink" x="96" y="76">Accion a</text>
    <text class="small muted" x="36" y="116">La decision disponible ahora.</text>
    <text class="small muted" x="36" y="138">En Arkanoid hay solo tres.</text>
    <g transform="translate(36 170)">
      <rect width="54" height="36" rx="18" fill="#cffafe" stroke="#67e8f9"/>
      <text class="mono" x="27" y="23" text-anchor="middle" fill="#0e7490">&lt;-</text>
      <rect x="66" width="70" height="36" rx="18" fill="#cffafe" stroke="#67e8f9"/>
      <text class="mono" x="101" y="23" text-anchor="middle" fill="#0e7490">quieto</text>
      <rect x="148" width="54" height="36" rx="18" fill="#cffafe" stroke="#67e8f9"/>
      <text class="mono" x="175" y="23" text-anchor="middle" fill="#0e7490">-&gt;</text>
    </g>
    <text class="small muted" x="36" y="236">La politica decide cual</text>
    <text class="small muted" x="36" y="258">conviene probar.</text>
  </g>

  <g transform="translate(620 154)">
    <rect width="250" height="286" rx="28" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <circle cx="56" cy="54" r="24" fill="#0f9f6e"/>
    <text class="label" x="56" y="61" text-anchor="middle" fill="#fff">3</text>
    <text class="tiny" x="96" y="46" fill="#047857">LA CONSECUENCIA</text>
    <text class="label ink" x="96" y="76">Recompensa r</text>
    <text class="small muted" x="36" y="116">Un numero que llega despues</text>
    <text class="small muted" x="36" y="138">de actuar. No explica por que.</text>
    <rect x="36" y="170" width="178" height="36" rx="18" fill="#d1fae5" stroke="#86efac"/>
    <text class="mono" x="125" y="193" text-anchor="middle" fill="#047857">+1, +0.2, -1</text>
    <text class="small muted" x="36" y="236">Es la senal de aprendizaje,</text>
    <text class="small muted" x="36" y="258">no la medida final de exito.</text>
  </g>

  <g transform="translate(895 154)">
    <rect width="250" height="286" rx="28" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
    <circle cx="56" cy="54" r="24" fill="#7c3aed"/>
    <text class="label" x="56" y="61" text-anchor="middle" fill="#fff">4</text>
    <text class="tiny" x="96" y="46" fill="#6d28d9">LA PARTIDA</text>
    <text class="label ink" x="96" y="76">Episodio</text>
    <text class="small muted" x="36" y="116">Una secuencia de pasos</text>
    <text class="small muted" x="36" y="138">hasta limpiar, perder o agotar</text>
    <text class="small muted" x="36" y="160">el reloj de la partida.</text>
    <rect x="36" y="190" width="178" height="36" rx="18" fill="#ede9fe" stroke="#c4b5fd"/>
    <text class="mono" x="125" y="213" text-anchor="middle" fill="#6d28d9">s, a, r, s'...</text>
    <text class="small muted" x="36" y="248">Aprender es repetir muchos</text>
    <text class="small muted" x="36" y="270">episodios y ajustar.</text>
  </g>

  <rect x="160" y="514" width="880" height="80" rx="28" fill="#111827"/>
  <text class="tiny" x="600" y="544" text-anchor="middle" fill="#cbd5e1">LO QUE NO HACE FALTA AUN</text>
  <text class="body" x="600" y="574" text-anchor="middle" fill="#fff">Retorno, Bellman y gradientes vienen despues. Aqui basta con entender consecuencia.</text>
</svg>
