<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro niveles de exigencia en Arkanoid</title>
  <desc id="desc">Escalera visual con cuatro niveles: sobrevivir, romper algunos ladrillos, limpiar el nivel y generalizar a niveles no vistos.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="48" y="58">Jugar bien no es una cosa: son cuatro escalones</text>
  <text class="body muted" x="48" y="88">Una recompensa al alza puede quedarse abajo. El examen serio esta arriba.</text>

  <g transform="translate(80 238)">
    <rect width="230" height="330" rx="28" fill="#f8fafc" stroke="#cbd5e1" class="shadow"/>
    <circle cx="54" cy="54" r="24" fill="#64748b"/>
    <text class="label" x="54" y="61" text-anchor="middle" fill="#fff">1</text>
    <text class="tiny" x="92" y="48" fill="#475569">BASE</text>
    <text class="label ink" x="38" y="96">Sobrevivir</text>
    <text class="small muted" x="38" y="128">Devolver la bola.</text>
    <text class="small muted" x="38" y="150">No exige apuntar.</text>
    <rect x="38" y="198" width="154" height="36" rx="18" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text class="mono" x="115" y="221" text-anchor="middle" fill="#334155">rebotes +0.2</text>
    <text class="small muted" x="38" y="270">Puede subir la recompensa</text>
    <text class="small muted" x="38" y="292">sin resolver el nivel.</text>
  </g>

  <g transform="translate(330 188)">
    <rect width="230" height="380" rx="28" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <circle cx="54" cy="54" r="24" fill="#2563eb"/>
    <text class="label" x="54" y="61" text-anchor="middle" fill="#fff">2</text>
    <text class="tiny" x="92" y="48" fill="#1d4ed8">PRIMER LOGRO</text>
    <text class="label ink" x="38" y="96">Romper algunos</text>
    <text class="small muted" x="38" y="128">La bola toca ladrillos,</text>
    <text class="small muted" x="38" y="150">a veces por casualidad.</text>
    <rect x="38" y="216" width="154" height="36" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
    <text class="mono" x="115" y="239" text-anchor="middle" fill="#1d4ed8">ladrillos +1.0</text>
    <text class="small muted" x="38" y="306">Mejor que sobrevivir,</text>
    <text class="small muted" x="38" y="328">pero aun no basta.</text>
  </g>

  <g transform="translate(580 138)">
    <rect width="230" height="430" rx="28" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <circle cx="54" cy="54" r="24" fill="#0f9f6e"/>
    <text class="label" x="54" y="61" text-anchor="middle" fill="#fff">3</text>
    <text class="tiny" x="92" y="48" fill="#047857">OBJETIVO</text>
    <text class="label ink" x="38" y="96">Limpiar nivel</text>
    <text class="small muted" x="38" y="128">Vaciar los 80 ladrillos.</text>
    <text class="small muted" x="38" y="150">Esto ya es exito.</text>
    <rect x="38" y="234" width="154" height="36" rx="18" fill="#d1fae5" stroke="#86efac"/>
    <text class="mono" x="115" y="257" text-anchor="middle" fill="#047857">success rate</text>
    <text class="small muted" x="38" y="346">La metrica externa</text>
    <text class="small muted" x="38" y="368">que juzga al agente.</text>
  </g>

  <g transform="translate(830 88)">
    <rect width="290" height="480" rx="28" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <circle cx="54" cy="54" r="24" fill="#f97316"/>
    <text class="label" x="54" y="61" text-anchor="middle" fill="#fff">4</text>
    <text class="tiny" x="92" y="48" fill="#c2410c">EXAMEN REAL</text>
    <text class="label ink" x="38" y="96">Generalizar</text>
    <text class="small muted" x="38" y="128">Limpiar niveles no vistos</text>
    <text class="small muted" x="38" y="150">durante entrenamiento.</text>
    <rect x="38" y="254" width="204" height="36" rx="18" fill="#ffedd5" stroke="#fed7aa"/>
    <text class="mono" x="140" y="277" text-anchor="middle" fill="#c2410c">TEST / OOD</text>
    <text class="small muted" x="38" y="386">Descarta memorizar.</text>
    <text class="small muted" x="38" y="408">Comprueba que sabe jugar</text>
    <text class="small muted" x="38" y="430">en patrones nuevos.</text>
  </g>

  <path d="M310,404 H324" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560,384 H574" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M810,364 H824" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="160" y="638" width="880" height="46" rx="23" fill="#111827"/>
  <text class="body" x="600" y="668" text-anchor="middle" fill="#fff">La pregunta sana no es "sube la recompensa?", sino "en que escalon esta el agente?".</text>
</svg>
