<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">El bucle de aprendizaje por refuerzo en cuatro vinetas</title>
  <desc id="desc">Tira de cuatro vinetas: observar estado, elegir accion, recibir consecuencia y aprender para repetir.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="48" y="58">El bucle RL: una pelicula de cuatro fotogramas</text>
  <text class="body muted" x="48" y="88">No hay profesor con la jugada correcta: el agente actua, recibe consecuencia y ajusta.</text>

  <g transform="translate(50 148)">
    <rect width="250" height="380" rx="28" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#1d4ed8">1 - OBSERVAR</text>
    <text class="label ink" x="32" y="76">Estado s</text>
    <rect x="46" y="112" width="158" height="150" rx="16" fill="#0b1020"/>
    <g transform="translate(64 132)">
      <rect x="0" y="0" width="28" height="12" rx="3" fill="#fb7185"/>
      <rect x="34" y="0" width="28" height="12" rx="3" fill="#fb7185"/>
      <rect x="68" y="0" width="28" height="12" rx="3" fill="#fb7185"/>
      <rect x="102" y="0" width="28" height="12" rx="3" fill="#fb7185"/>
      <rect x="0" y="20" width="28" height="12" rx="3" fill="#f59e0b"/>
      <rect x="34" y="20" width="28" height="12" rx="3" fill="#f59e0b"/>
      <rect x="68" y="20" width="28" height="12" rx="3" fill="#f59e0b"/>
      <rect x="102" y="20" width="28" height="12" rx="3" fill="#f59e0b"/>
      <rect x="0" y="40" width="28" height="12" rx="3" fill="#34d399"/>
      <rect x="34" y="40" width="28" height="12" rx="3" fill="#34d399"/>
      <rect x="68" y="40" width="28" height="12" rx="3" fill="#34d399"/>
      <rect x="102" y="40" width="28" height="12" rx="3" fill="#34d399"/>
      <circle cx="88" cy="94" r="7" fill="#e5e7eb"/>
      <rect x="44" y="122" width="54" height="10" rx="5" fill="#818cf8"/>
    </g>
    <rect x="46" y="286" width="158" height="36" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
    <text class="mono" x="125" y="309" text-anchor="middle" fill="#1d4ed8">86 numeros</text>
    <text class="small muted" x="32" y="352">La situacion entra como datos,</text>
    <text class="small muted" x="32" y="372">no como significado humano.</text>
  </g>

  <g transform="translate(337 148)">
    <rect width="250" height="380" rx="28" fill="#ecfeff" stroke="#a5f3fc" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#0e7490">2 - DECIDIR</text>
    <text class="label ink" x="32" y="76">Accion a</text>
    <rect x="42" y="120" width="166" height="60" rx="20" fill="#cffafe" stroke="#67e8f9"/>
    <text class="mono" x="125" y="155" text-anchor="middle" fill="#0e7490">pi(a|s)</text>
    <g transform="translate(42 218)">
      <rect width="50" height="42" rx="14" fill="#fff" stroke="#94a3b8"/>
      <text class="mono" x="25" y="27" text-anchor="middle" fill="#334155">&lt;-</text>
      <rect x="58" width="58" height="42" rx="14" fill="#0891b2"/>
      <text class="mono" x="87" y="27" text-anchor="middle" fill="#fff">quieto</text>
      <rect x="124" width="50" height="42" rx="14" fill="#fff" stroke="#94a3b8"/>
      <text class="mono" x="149" y="27" text-anchor="middle" fill="#334155">-&gt;</text>
    </g>
    <text class="small muted" x="32" y="314">Al principio prueba mucho.</text>
    <text class="small muted" x="32" y="336">Despues elige lo que cree</text>
    <text class="small muted" x="32" y="358">que dara mas futuro.</text>
  </g>

  <g transform="translate(624 148)">
    <rect width="250" height="380" rx="28" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#047857">3 - RECIBIR</text>
    <text class="label ink" x="32" y="76">r, s', done</text>
    <g transform="translate(42 118)">
      <rect width="166" height="48" rx="18" fill="#d1fae5" stroke="#86efac"/>
      <text class="mono" x="83" y="30" text-anchor="middle" fill="#047857">+1 ladrillo</text>
      <rect y="66" width="166" height="48" rx="18" fill="#fef3c7" stroke="#fde68a"/>
      <text class="mono" x="83" y="96" text-anchor="middle" fill="#92400e">+0.2 rebote</text>
      <rect y="132" width="166" height="48" rx="18" fill="#fee2e2" stroke="#fecaca"/>
      <text class="mono" x="83" y="162" text-anchor="middle" fill="#991b1b">-1 pierde bola</text>
    </g>
    <text class="small muted" x="32" y="326">El entorno no explica.</text>
    <text class="small muted" x="32" y="348">Solo devuelve numero,</text>
    <text class="small muted" x="32" y="370">nuevo estado y si termino.</text>
  </g>

  <g transform="translate(911 148)">
    <rect width="250" height="380" rx="28" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#6d28d9">4 - APRENDER</text>
    <text class="label ink" x="32" y="76">Guardar y ajustar</text>
    <rect x="42" y="124" width="166" height="46" rx="16" fill="#ede9fe" stroke="#c4b5fd"/>
    <text class="mono" x="125" y="152" text-anchor="middle" fill="#6d28d9">(s,a,r,s',done)</text>
    <rect x="42" y="198" width="166" height="46" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text class="mono" x="125" y="226" text-anchor="middle" fill="#334155">actualizar pi/Q</text>
    <path d="M125,260 C168,282 168,316 125,338 C82,316 82,282 125,260" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
    <text class="small muted" x="32" y="356">La proxima vuelta empieza</text>
    <text class="small muted" x="32" y="376">un poco menos a ciegas.</text>
  </g>

  <path d="M300,338 H330" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M587,338 H617" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M874,338 H904" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="170" y="610" width="860" height="52" rx="26" fill="#111827"/>
  <text class="body" x="600" y="643" text-anchor="middle" fill="#fff">Aprender por refuerzo = repetir este ciclo hasta que la politica mejore.</text>
</svg>
