<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Retorno: mirar mas alla del premio inmediato</title>
<desc id="desc">Gamma convierte una secuencia de recompensas futuras en una sola promesa acumulada.</desc>
<defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}.line{stroke:#dbe2ea}.white{fill:#fff}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.35px}
      .num{font:900 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker>
  </defs>
<rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="52" y="58">Retorno: mirar mas alla del premio inmediato</text>
  <text class="body muted" x="52" y="88">Gamma convierte una secuencia de recompensas futuras en una sola promesa acumulada.</text>

<g transform="translate(141 230)">
<rect width="210" height="170" rx="22" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#047857">t</text>
<text class="label ink" x="24" y="68">+0.2 ahora</text>
<text class="small muted" x="24" y="108">rebote en la pala;</text>
<text class="small muted" x="24" y="130">senal pequena e</text>
<text class="small muted" x="24" y="152">inmediata</text>
</g>
<path d="M359 315H367" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(377 230)">
<rect width="210" height="170" rx="22" fill="#ecfeff" stroke="#bae6fd" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#0891b2">t+5</text>
<text class="label ink" x="24" y="68">+1 despues</text>
<text class="small muted" x="24" y="108">rompe ladrillo</text>
<text class="small muted" x="24" y="130">varios pasos mas</text>
<text class="small muted" x="24" y="152">tarde</text>
</g>
<path d="M595 315H603" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(613 230)">
<rect width="210" height="170" rx="22" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#7c3aed">t+30</text>
<text class="label ink" x="24" y="68">+5 final</text>
<text class="small muted" x="24" y="108">limpia nivel;</text>
<text class="small muted" x="24" y="130">recompensa grande</text>
<text class="small muted" x="24" y="152">pero lejana</text>
</g>
<path d="M831 315H839" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(849 230)">
<rect width="210" height="170" rx="22" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#d97706">gamma</text>
<text class="label ink" x="24" y="68">Descuento</text>
<text class="small muted" x="24" y="108">lo lejano pesa menos</text>
<text class="small muted" x="24" y="130">cuanto menor es</text>
<text class="small muted" x="24" y="152">gamma</text>
</g>
<rect x="190" y="620" width="820" height="56" rx="28" fill="#111827"/>
<text class="body" x="600" y="654" text-anchor="middle" fill="#fff">El agente no maximiza r de un paso: maximiza retorno esperado.</text>
</svg>
