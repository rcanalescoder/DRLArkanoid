<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Familias del generador procedural</title>
  <desc id="desc">Cinco familias de niveles de Arkanoid con patrones espaciales distintos.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="48" y="58">El generador fabrica familias, no niveles sueltos</text>
  <text class="body muted" x="48" y="88">Cada familia tiene una firma espacial. Generalizar es leer esa forma cuando cambia la instancia concreta.</text>

  <g transform="translate(64 138)">
    <rect width="200" height="260" rx="28" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#c2410c">FAMILIA</text>
    <text class="label ink" x="32" y="72">Dispersion</text>
    <rect x="38" y="98" width="124" height="92" rx="16" fill="#0f172a"/>
    <g fill="#fb7185"><rect x="56" y="116" width="18" height="8" rx="3"/><rect x="120" y="126" width="18" height="8" rx="3"/><rect x="86" y="154" width="18" height="8" rx="3"/></g>
    <g fill="#34d399"><rect x="74" y="138" width="18" height="8" rx="3"/><rect x="132" y="164" width="18" height="8" rx="3"/></g>
    <g fill="#f59e0b"><rect x="108" y="146" width="18" height="8" rx="3"/><rect x="54" y="172" width="18" height="8" rx="3"/></g>
    <text class="small muted" x="32" y="216">Pocos ladrillos,</text>
    <text class="small muted" x="32" y="236">sin geometria clara.</text>
  </g>

  <g transform="translate(286 138)">
    <rect width="200" height="260" rx="28" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#1d4ed8">FAMILIA</text>
    <text class="label ink" x="32" y="72">Filas</text>
    <rect x="38" y="98" width="124" height="92" rx="16" fill="#0f172a"/>
    <g fill="#fb7185"><rect x="54" y="118" width="92" height="8" rx="3"/></g>
    <g fill="#f59e0b"><rect x="54" y="140" width="92" height="8" rx="3"/></g>
    <g fill="#34d399"><rect x="54" y="162" width="92" height="8" rx="3"/></g>
    <text class="small muted" x="32" y="216">Bandas horizontales.</text>
    <text class="small muted" x="32" y="236">Cambian posiciones.</text>
  </g>

  <g transform="translate(508 138)">
    <rect width="200" height="260" rx="28" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#6d28d9">FAMILIA</text>
    <text class="label ink" x="32" y="72">Columnas</text>
    <rect x="38" y="98" width="124" height="92" rx="16" fill="#0f172a"/>
    <rect x="62" y="116" width="10" height="56" rx="4" fill="#fb7185"/>
    <rect x="94" y="116" width="10" height="56" rx="4" fill="#f59e0b"/>
    <rect x="126" y="116" width="10" height="56" rx="4" fill="#34d399"/>
    <text class="small muted" x="32" y="216">Bandas verticales.</text>
    <text class="small muted" x="32" y="236">Exigen otro angulo.</text>
  </g>

  <g transform="translate(730 138)">
    <rect width="200" height="260" rx="28" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#047857">FAMILIA</text>
    <text class="label ink" x="32" y="72">Bloque</text>
    <rect x="38" y="98" width="124" height="92" rx="16" fill="#0f172a"/>
    <g fill="#34d399">
      <rect x="70" y="124" width="64" height="10" rx="3"/><rect x="70" y="140" width="64" height="10" rx="3"/><rect x="70" y="156" width="64" height="10" rx="3"/>
    </g>
    <text class="small muted" x="32" y="216">Masa compacta.</text>
    <text class="small muted" x="32" y="236">Abrir hueco importa.</text>
  </g>

  <g transform="translate(952 138)">
    <rect width="200" height="260" rx="28" fill="#fef2f2" stroke="#fecaca" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#dc2626">FAMILIA</text>
    <text class="label ink" x="32" y="72">Simetrico</text>
    <rect x="38" y="98" width="124" height="92" rx="16" fill="#0f172a"/>
    <g fill="#fb7185"><rect x="58" y="120" width="20" height="8" rx="3"/><rect x="122" y="120" width="20" height="8" rx="3"/></g>
    <g fill="#34d399"><rect x="76" y="144" width="20" height="8" rx="3"/><rect x="104" y="144" width="20" height="8" rx="3"/></g>
    <g fill="#f59e0b"><rect x="58" y="168" width="20" height="8" rx="3"/><rect x="122" y="168" width="20" height="8" rx="3"/></g>
    <line x1="100" y1="112" x2="100" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
    <text class="small muted" x="32" y="216">Eje espejo.</text>
    <text class="small muted" x="32" y="236">Dos lados conectados.</text>
  </g>

  <rect x="168" y="456" width="864" height="114" rx="28" fill="#f8fafc" stroke="#cbd5e1" class="shadow"/>
  <text class="tiny muted" x="212" y="496">POR QUE IMPORTA</text>
  <text class="label ink" x="212" y="528">El split no solo separa niveles; tambien puede separar tipos de forma.</text>
  <text class="body muted" x="212" y="560">TEST-ID cambia la instancia. OOD-patron cambia la familia. OOD-dificultad cambia la densidad.</text>

  <rect x="250" y="636" width="700" height="48" rx="24" fill="#111827"/>
  <text class="body" x="600" y="667" text-anchor="middle" fill="#fff">La red debe aprender una regla espacial, no recordar una foto concreta del muro.</text>
</svg>
