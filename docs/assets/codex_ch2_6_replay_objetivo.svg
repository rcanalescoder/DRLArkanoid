<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Replay y red objetivo: dos estabilizadores</title>
<desc id="desc">DQN necesita que los datos y la diana no se muevan demasiado a la vez.</desc>
<defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}.line{stroke:#dbe2ea}.white{fill:#fff}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.35px}
      .num{font:900 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker>
  </defs>
<rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="52" y="58">Replay y red objetivo: dos estabilizadores</text>
  <text class="body muted" x="52" y="88">DQN necesita que los datos y la diana no se muevan demasiado a la vez.</text>

<g transform="translate(141 230)">
<rect width="210" height="170" rx="22" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#d97706">PASO 1</text>
<text class="label ink" x="24" y="68">Experiencia seguida</text>
<text class="small muted" x="24" y="108">pasos consecutivos</text>
<text class="small muted" x="24" y="130">se parecen demasiado</text>
</g>
<path d="M359 315H367" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(377 230)">
<rect width="210" height="170" rx="22" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#2563eb">PASO 2</text>
<text class="label ink" x="24" y="68">Replay buffer</text>
<text class="small muted" x="24" y="108">guarda transiciones</text>
<text class="small muted" x="24" y="130">y rompe</text>
<text class="small muted" x="24" y="152">correlaciones</text>
</g>
<path d="M595 315H603" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(613 230)">
<rect width="210" height="170" rx="22" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#7c3aed">PASO 3</text>
<text class="label ink" x="24" y="68">Minibatch</text>
<text class="small muted" x="24" y="108">mezcla pasado para</text>
<text class="small muted" x="24" y="130">entrenar con</text>
<text class="small muted" x="24" y="152">muestras variadas</text>
</g>
<path d="M831 315H839" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(849 230)">
<rect width="210" height="170" rx="22" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#047857">PASO 4</text>
<text class="label ink" x="24" y="68">Red objetivo</text>
<text class="small muted" x="24" y="108">calcula dianas con</text>
<text class="small muted" x="24" y="130">una copia lenta</text>
</g>
<rect x="190" y="620" width="820" height="56" rx="28" fill="#111827"/>
<text class="body" x="600" y="654" text-anchor="middle" fill="#fff">Replay estabiliza los datos; target network estabiliza el blanco.</text>
</svg>
