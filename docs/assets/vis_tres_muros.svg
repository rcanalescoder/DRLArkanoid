<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" style="width:100%;height:auto"><defs><marker id="ah-6b7280" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6b7280"/></marker><marker id="ah-2563eb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker><marker id="ah-0c9f6e" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0c9f6e"/></marker><marker id="ah-991b1b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#991b1b"/></marker><marker id="ah-b45309" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/></marker><marker id="ah-6d28d9" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6d28d9"/></marker><marker id="ah-0e7490" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0e7490"/></marker><marker id="ah-dc2626" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker><marker id="ah-334155" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><text x="40" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#1f2937">Diagnóstico: tres muros, ninguno el algoritmo</text><text x="40" y="62" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b7280">Cada muro: síntoma → hipótesis falsa → prueba → causa real → corrección.</text><rect x="40" y="82" width="290" height="300" rx="12" fill="#fff" stroke="#b45309" stroke-width="1.7"/><rect x="40" y="82" width="290" height="34" rx="12" fill="#b45309" stroke="#b45309" stroke-width="0"/><rect x="40" y="100" width="290" height="16" rx="0" fill="#b45309" stroke="#b45309" stroke-width="0"/><text x="54" y="105" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" text-anchor="start" fill="#fff">MURO 1 · El reloj</text><text x="54" y="138" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Síntoma: nunca limpia.</text><text x="54" y="158" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Hipótesis falsa: «falta entrenar».</text><text x="54" y="178" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Prueba: 600 pasos &lt; 7.200 que pide un</text><text x="54" y="194" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">8×10.</text><text x="54" y="214" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Causa: timeout fijo demasiado corto.</text><text x="54" y="234" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Arreglo: timeout proporcional</text><text x="54" y="250" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">(90/ladrillo).</text><rect x="345" y="82" width="290" height="300" rx="12" fill="#fff" stroke="#6d28d9" stroke-width="1.7"/><rect x="345" y="82" width="290" height="34" rx="12" fill="#6d28d9" stroke="#6d28d9" stroke-width="0"/><rect x="345" y="100" width="290" height="16" rx="0" fill="#6d28d9" stroke="#6d28d9" stroke-width="0"/><text x="359" y="105" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" text-anchor="start" fill="#fff">MURO 2 · La recompensa</text><text x="359" y="138" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Síntoma: sobrevive, no gana.</text><text x="359" y="158" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Hipótesis falsa: «mal algoritmo».</text><text x="359" y="178" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Prueba: quitar el shaping Φ sube +8.</text><text x="359" y="198" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Causa: Φ premiaba acercarse, no ganar.</text><text x="359" y="218" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Arreglo: meta limpia, sin shaping Φ.</text><rect x="650" y="82" width="290" height="300" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.7"/><rect x="650" y="82" width="290" height="34" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><rect x="650" y="100" width="290" height="16" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="664" y="105" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" text-anchor="start" fill="#fff">MURO 3 · La observación</text><text x="664" y="138" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Síntoma: no apunta.</text><text x="664" y="158" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Hipótesis falsa: «más pasos».</text><text x="664" y="178" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Prueba: sin matriz de ladrillos,</text><text x="664" y="194" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">techo.</text><text x="664" y="214" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Causa: la observación no ve los</text><text x="664" y="230" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">ladrillos.</text><text x="664" y="250" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Arreglo: matriz de ocupación 8×10.</text></svg>