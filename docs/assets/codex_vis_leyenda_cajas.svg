<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Mapa funcional del sistema de cajas</title>
  <desc id="desc">Diagrama que agrupa las cajas del documento por funcion: preparar, aterrizar, corregir, delimitar, profundizar, cerrar y practicar.</desc>
  <defs>
    <style>
      .bg{fill:#fff}
      .ink{fill:#111827}
      .muted{fill:#64748b}
      .title{font:800 26px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .group{font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.4px}
      .label{font:800 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.5px}
      .dash{stroke-dasharray:6 5}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1100" height="620"/>
  <text class="title ink" x="42" y="54">El sistema de cajas, ordenado por funcion</text>
  <text class="body muted" x="42" y="82">No es una lista de colores: cada caja responde a una necesidad concreta del lector.</text>

  <rect x="42" y="110" width="496" height="136" rx="18" fill="#f8fafc" stroke="#dbe2ea" class="shadow"/>
  <text class="group" x="66" y="140" fill="#334155">ANTES DE UN ELEMENTO DIFICIL</text>
  <line x1="290" y1="134" x2="334" y2="134" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="66" y="158" width="214" height="62" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <rect x="66" y="158" width="7" height="62" rx="3.5" fill="#2563eb"/>
  <text class="label" x="88" y="181" fill="#2563eb">Antes de la formula</text>
  <text class="small ink" x="88" y="201">traduce la ecuacion a palabras</text>
  <rect x="302" y="158" width="212" height="62" rx="11" fill="#fff7ed" stroke="#d97706" stroke-width="1.3"/>
  <rect x="302" y="158" width="7" height="62" rx="3.5" fill="#d97706"/>
  <text class="label" x="324" y="181" fill="#b45309">Que mirar</text>
  <text class="small ink" x="324" y="201">dice que comparacion importa</text>

  <rect x="562" y="110" width="496" height="136" rx="18" fill="#f8fafc" stroke="#dbe2ea" class="shadow"/>
  <text class="group" x="586" y="140" fill="#334155">MIENTRAS LEES EL CONCEPTO</text>
  <rect x="586" y="158" width="214" height="62" rx="11" fill="#ecfeff" stroke="#0891b2" stroke-width="1.3"/>
  <rect x="586" y="158" width="7" height="62" rx="3.5" fill="#0891b2"/>
  <text class="label" x="608" y="181" fill="#0e7490">Traduccion al juego</text>
  <text class="small ink" x="608" y="201">lo baja a bola, pala y ladrillos</text>
  <rect x="822" y="158" width="212" height="62" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="822" y="158" width="7" height="62" rx="3.5" fill="#dc2626"/>
  <text class="label" x="844" y="181" fill="#b91c1c">Error comun</text>
  <text class="small ink" x="844" y="201">nombra la trampa mental</text>

  <rect x="42" y="270" width="1016" height="144" rx="18" fill="#f8fafc" stroke="#dbe2ea" class="shadow"/>
  <text class="group" x="66" y="300" fill="#334155">DESPUES DEL DATO, O EN UNA SEGUNDA PISTA</text>
  <rect x="66" y="318" width="298" height="68" rx="11" fill="#f5f6f8" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="66" y="318" width="7" height="68" rx="3.5" fill="#64748b"/>
  <text class="label" x="90" y="342" fill="#475569">Que no demuestra</text>
  <text class="small ink" x="90" y="362">separa evidencia de especulacion</text>
  <rect x="402" y="318" width="298" height="68" rx="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" class="dash"/>
  <rect x="402" y="318" width="7" height="68" rx="3.5" fill="#64748b"/>
  <text class="label" x="426" y="342" fill="#475569">Para curiosos</text>
  <text class="small ink" x="426" y="362">formalismo opcional sin romper el hilo</text>
  <rect x="738" y="318" width="296" height="68" rx="11" fill="#fff5f5" stroke="#991b1b" stroke-width="1.3"/>
  <rect x="738" y="318" width="7" height="68" rx="3.5" fill="#991b1b"/>
  <text class="label" x="762" y="342" fill="#991b1b">Y ahora, para expertos</text>
  <text class="small ink" x="762" y="362">la misma materia, comprimida y tecnica</text>

  <rect x="42" y="438" width="1016" height="132" rx="18" fill="#f8fafc" stroke="#dbe2ea" class="shadow"/>
  <text class="group" x="66" y="468" fill="#334155">CIERRE: RECORDAR, COMPROBAR Y HACER</text>
  <rect x="66" y="486" width="298" height="58" rx="11" fill="#ecfdf5" stroke="#0f9f6e" stroke-width="1.3"/>
  <rect x="66" y="486" width="7" height="58" rx="3.5" fill="#0f9f6e"/>
  <text class="label" x="90" y="509" fill="#047857">Quedate con esto</text>
  <text class="small ink" x="90" y="528">la idea que debe sobrevivir</text>
  <rect x="402" y="486" width="298" height="58" rx="11" fill="#ecfdf5" stroke="#0f9f6e" stroke-width="1.3"/>
  <rect x="402" y="486" width="7" height="58" rx="3.5" fill="#0f9f6e"/>
  <text class="label" x="426" y="509" fill="#047857">Autocomprobacion</text>
  <text class="small ink" x="426" y="528">3 preguntas para detectar huecos</text>
  <rect x="738" y="486" width="296" height="58" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <rect x="738" y="486" width="7" height="58" rx="3.5" fill="#7c3aed"/>
  <text class="label" x="762" y="509" fill="#6d28d9">Ejercicio</text>
  <text class="small ink" x="762" y="528">pasar de leer a razonar</text>

  <rect x="42" y="586" width="1016" height="24" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text class="tiny muted" x="550" y="602" text-anchor="middle">LECTURA RAPIDA: azul prepara formulas · cian aterriza en Arkanoid · rojo evita errores · verde cierra · violeta practica · gris delimita o profundiza</text>
</svg>
