<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Panel de herramientas de lectura</title>
  <desc id="desc">Mapa funcional de cajas pedagogicas: unas orientan antes de ver una formula o grafica, otras aterrizan el concepto, otras protegen la interpretacion y otras cierran el aprendizaje.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .group{font:800 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.55px}
      .label{font:800 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="46" y="58">Las cajas no decoran: son herramientas de lectura</text>
  <text class="body muted" x="46" y="88">Cada color responde una pregunta distinta cuando aparece una formula, una grafica o un resultado.</text>

  <rect x="424" y="154" width="352" height="188" rx="30" fill="#ffffff" stroke="#dbe2ea" class="shadow"/>
  <text class="tiny muted" x="600" y="190" text-anchor="middle">LO QUE ESTAS LEYENDO</text>
  <rect x="462" y="216" width="276" height="42" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="mono ink" x="600" y="242" text-anchor="middle">objetivo = r + gamma max Q</text>
  <rect x="462" y="276" width="112" height="36" rx="10" fill="#dbeafe"/>
  <rect x="592" y="276" width="64" height="36" rx="10" fill="#dcfce7"/>
  <rect x="674" y="276" width="64" height="36" rx="10" fill="#fed7aa"/>
  <text class="small muted" x="600" y="366" text-anchor="middle">Sin ayuda, esto puede ser ruido.</text>

  <rect x="64" y="138" width="282" height="216" rx="24" fill="#f8fafc" stroke="#dbe2ea" class="shadow"/>
  <text class="group" x="92" y="174" fill="#334155">ANTES DE MIRAR</text>
  <text class="small muted" x="92" y="197">preparan el foco</text>
  <rect x="92" y="222" width="226" height="54" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <rect x="92" y="222" width="7" height="54" rx="3.5" fill="#2563eb"/>
  <text class="label" x="112" y="244" fill="#1d4ed8">Antes de la formula</text>
  <text class="small ink" x="112" y="262">Que calcula?</text>
  <rect x="92" y="288" width="226" height="54" rx="12" fill="#fff7ed" stroke="#d97706"/>
  <rect x="92" y="288" width="7" height="54" rx="3.5" fill="#d97706"/>
  <text class="label" x="112" y="310" fill="#b45309">Que mirar</text>
  <text class="small ink" x="112" y="328">Que comparacion importa?</text>
  <path d="M346,246 C382,236 392,230 424,230" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M346,316 C384,318 394,300 424,292" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="854" y="138" width="282" height="216" rx="24" fill="#f8fafc" stroke="#dbe2ea" class="shadow"/>
  <text class="group" x="882" y="174" fill="#334155">DURANTE LA IDEA</text>
  <text class="small muted" x="882" y="197">la conectan con Arkanoid</text>
  <rect x="882" y="222" width="226" height="54" rx="12" fill="#ecfeff" stroke="#0891b2"/>
  <rect x="882" y="222" width="7" height="54" rx="3.5" fill="#0891b2"/>
  <text class="label" x="902" y="244" fill="#0e7490">Traduccion al juego</text>
  <text class="small ink" x="902" y="262">Como se ve en bola y pala?</text>
  <rect x="882" y="288" width="226" height="54" rx="12" fill="#fef2f2" stroke="#dc2626"/>
  <rect x="882" y="288" width="7" height="54" rx="3.5" fill="#dc2626"/>
  <text class="label" x="902" y="310" fill="#b91c1c">Error comun</text>
  <text class="small ink" x="902" y="328">Que confusion evita?</text>
  <path d="M854,246 C818,238 806,232 776,230" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M854,316 C818,320 806,300 776,292" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="154" y="424" width="892" height="144" rx="28" fill="#ffffff" stroke="#dbe2ea" class="shadow"/>
  <text class="group" x="190" y="462" fill="#334155">DESPUES DEL RESULTADO: HONESTIDAD Y PROFUNDIDAD</text>
  <rect x="190" y="488" width="238" height="54" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="190" y="488" width="7" height="54" rx="3.5" fill="#64748b"/>
  <text class="label" x="212" y="510" fill="#475569">Que no demuestra</text>
  <text class="small ink" x="212" y="528">Hasta donde llega el dato?</text>
  <rect x="482" y="488" width="238" height="54" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <rect x="482" y="488" width="7" height="54" rx="3.5" fill="#64748b"/>
  <text class="label" x="504" y="510" fill="#475569">Para curiosos</text>
  <text class="small ink" x="504" y="528">Quiero mas formalismo?</text>
  <rect x="774" y="488" width="238" height="54" rx="12" fill="#fff5f5" stroke="#991b1b"/>
  <rect x="774" y="488" width="7" height="54" rx="3.5" fill="#991b1b"/>
  <text class="label" x="796" y="510" fill="#991b1b">Para expertos</text>
  <text class="small ink" x="796" y="528">Version tecnica compacta</text>

  <rect x="154" y="606" width="892" height="94" rx="28" fill="#f8fafc" stroke="#dbe2ea" class="shadow"/>
  <text class="group" x="190" y="640" fill="#334155">CIERRE: LO QUE DEBE QUEDAR EN TU CABEZA</text>
  <rect x="190" y="654" width="238" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
  <text class="small" x="309" y="673" text-anchor="middle" fill="#047857">Quedate con esto</text>
  <rect x="482" y="654" width="238" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
  <text class="small" x="601" y="673" text-anchor="middle" fill="#047857">Autocomprobacion</text>
  <rect x="774" y="654" width="238" height="28" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
  <text class="small" x="893" y="673" text-anchor="middle" fill="#6d28d9">Ejercicio</text>

  <text class="body ink" x="600" y="394" text-anchor="middle">La leyenda buena no dice solo "de que color es": dice "cuando me salva".</text>
</svg>
