<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ficha de evaluacion confiable</title>
  <desc id="desc">Cuatro condiciones para que una cifra de exito sea reportable: metrica, modo greedy, semillas y oracle.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">Ficha de evaluacion: que numero merece confianza</text>
  <text class="body muted" x="48" y="88">Una tasa de exito solo es comparable si trae estas cuatro condiciones al lado.</text>

  <g transform="translate(92 146)">
    <rect width="460" height="188" rx="28" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <text class="tiny" x="34" y="42" fill="#1d4ed8">1 - METRICA</text>
    <text class="label ink" x="34" y="76">Exito, no recompensa</text>
    <text class="small muted" x="34" y="110">Cada nivel vale 1 si queda limpio,</text>
    <text class="small muted" x="34" y="130">0 si queda cualquier ladrillo.</text>
    <rect x="270" y="82" width="146" height="52" rx="26" fill="#dbeafe" stroke="#93c5fd"/>
    <text class="mono" x="343" y="114" text-anchor="middle" fill="#1d4ed8">limpios / N</text>
  </g>

  <g transform="translate(648 146)">
    <rect width="460" height="188" rx="28" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <text class="tiny" x="34" y="42" fill="#047857">2 - JUEGO</text>
    <text class="label ink" x="34" y="76">Greedy y reproducible</text>
    <text class="small muted" x="34" y="110">Sin exploracion: el agente juega</text>
    <text class="small muted" x="34" y="130">su mejor accion aprendida.</text>
    <rect x="276" y="78" width="132" height="58" rx="18" fill="#d1fae5" stroke="#86efac"/>
    <text class="mono" x="342" y="112" text-anchor="middle" fill="#047857">argmax Q</text>
  </g>

  <g transform="translate(92 384)">
    <rect width="460" height="188" rx="28" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <text class="tiny" x="34" y="42" fill="#c2410c">3 - ROBUSTEZ</text>
    <text class="label ink" x="34" y="76">Media de 5 semillas</text>
    <text class="small muted" x="34" y="110">No basta una ejecucion afortunada.</text>
    <text class="small muted" x="34" y="130">Importan media y colapsos.</text>
    <g transform="translate(304 83)" fill="#f97316">
      <circle cx="0" cy="0" r="12"/><circle cx="34" cy="0" r="12"/><circle cx="68" cy="0" r="12"/><circle cx="17" cy="34" r="12"/><circle cx="51" cy="34" r="12"/>
    </g>
  </g>

  <g transform="translate(648 384)">
    <rect width="460" height="188" rx="28" fill="#fef2f2" stroke="#fecaca" class="shadow"/>
    <text class="tiny" x="34" y="42" fill="#dc2626">4 - JUSTICIA</text>
    <text class="label ink" x="34" y="76">Oraculo de limpiabilidad</text>
    <text class="small muted" x="34" y="110">El test descarta niveles imposibles.</text>
    <text class="small muted" x="34" y="130">Fallos restantes son de politica.</text>
    <rect x="298" y="76" width="92" height="66" rx="18" fill="#fee2e2" stroke="#fca5a5"/>
    <path d="M322,110 L340,128 L370,92" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="230" y="628" width="740" height="48" rx="24" fill="#111827"/>
  <text class="body" x="600" y="659" text-anchor="middle" fill="#fff">Resultado reportable = split limpio + exito + greedy + 5 semillas + niveles resolubles.</text>
</svg>
