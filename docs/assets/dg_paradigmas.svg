height="170" rx="12" fill="#f4effe" stroke="#7c3aed" stroke-width="1.3"/><text x="415" y="78" text-anchor="middle" font-size="15" fill="#11181f" font-weight="700">Aprendizaje</text><text x="415" y="98" text-anchor="middle" font-size="15" fill="#11181f" font-weight="700">no supervisado</text><text x="415" y="130" text-anchor="middle" font-size="12" fill="#41464f" font-weight="400">datos sin etiqueta;</text><text x="415" y="147" text-anchor="middle" font-size="12" fill="#41464f" font-weight="400">busca estructura</text><text x="415" y="188" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="700">“estos se parecen”</text><rect x="560" y="40" width="230" height="170" rx="12" fill="#e9fbf4" stroke="#0c9f6e" stroke-width="1.3"/><text x="675" y="78" text-anchor="middle" font-size="15" fill="#11181f" font-weight="700">Aprendizaje por</text><text x="675" y="98" text-anchor="middle" font-size="15" fill="#11181f" font-weight="700">refuerzo (RL)</text><text x="675" y="130" text-anchor="middle" font-size="12" fill="#41464f" font-weight="400">premios y castigos</text><text x="675" y="147" text-anchor="middle" font-size="12" fill="#41464f" font-weight="400">al actuar</text><text x="675" y="188" text-anchor="middle" font-size="12" fill="#0c9f6e" font-weight="700">“+1 si ganas”</text><text x="430" y="232" text-anchor="middle" font-size="12" fill="#8a909b" font-weight="400">El RL no aprende de respuestas correctas, sino de la recompensa que recibe al probar.</text></svg>