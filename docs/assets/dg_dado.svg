ght="400">antes de mover</text><line x1="184" y1="120" x2="300" y2="110" stroke="#d97706" stroke-width="1.8" marker-end="url(#ard97706)"/><rect x="300" y="82" width="250" height="58" rx="12" fill="#e9fbf4" stroke="#0c9f6e" stroke-width="1.3"/><text x="425" y="108" text-anchor="middle" font-size="12" fill="#11181f" font-weight="700">sale BAJO → prueba algo</text><text x="425" y="127" text-anchor="middle" font-size="11" fill="#0c9f6e" font-weight="700">nuevo al azar (EXPLORAR)</text><line x1="184" y1="160" x2="300" y2="190" stroke="#d97706" stroke-width="1.8" marker-end="url(#ard97706)"/><rect x="300" y="165" width="250" height="58" rx="12" fill="#eff4fe" stroke="#2563eb" stroke-width="1.3"/><text x="425" y="191" text-anchor="middle" font-size="12" fill="#11181f" font-weight="700">si no → lo que YA sabe que</text><text x="425" y="210" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">funciona (EXPLOTAR)</text><rect x="600" y="82" width="230" height="141" rx="12" fill="#f8fafc" stroke="#d3dbe8" stroke-width="1.3"/><text x="715" y="108" text-anchor="middle" font-size="12" fill="#11181f" font-weight="700">Con el tiempo…</text><text x="715" y="134" text-anchor="middle" font-size="11" fill="#41464f" font-weight="400">el dado pide explorar</text><text x="715" y="150" text-anchor="middle" font-size="11" fill="#41464f" font-weight="400">cada vez MENOS (ya</text><text x="715" y="166" text-anchor="middle" font-size="11" fill="#41464f" font-weight="400">ha aprendido).</text><text x="715" y="196" text-anchor="middle" font-size="10.5" fill="#8a909b" font-weight="400">Ese % de azar baja poco</text><text x="715" y="210" text-anchor="middle" font-size="10.5" fill="#8a909b" font-weight="400">a poco: «ε» que «decae».</text></svg>