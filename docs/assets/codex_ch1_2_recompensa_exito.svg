<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Recompensa alta no equivale a exito</title>
  <desc id="desc">Grafica conceptual donde la recompensa media sube mientras el exito real se queda bajo.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">Cuando una curva bonita cuenta una historia falsa</text>
  <text class="body muted" x="48" y="88">La recompensa puede mejorar porque el agente sobrevive; el exito exige limpiar niveles.</text>

  <rect x="80" y="136" width="760" height="430" rx="30" fill="#ffffff" stroke="#dbe2ea" class="shadow"/>
  <g transform="translate(142 190)">
    <line x1="0" y1="300" x2="610" y2="300" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#334155" stroke-width="2"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="0" y1="240" x2="610" y2="240"/>
      <line x1="0" y1="180" x2="610" y2="180"/>
      <line x1="0" y1="120" x2="610" y2="120"/>
      <line x1="0" y1="60" x2="610" y2="60"/>
    </g>
    <text class="tiny muted" x="-18" y="6" text-anchor="end">1.0</text>
    <text class="tiny muted" x="-18" y="306" text-anchor="end">0</text>
    <text class="tiny muted" x="610" y="332" text-anchor="end">entrenamiento</text>
    <path d="M36,238 C110,160 188,110 286,82 C388,52 488,42 574,34" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <path d="M36,286 C150,280 270,274 386,268 C482,263 538,258 574,254" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <circle cx="574" cy="34" r="7" fill="#2563eb"/>
    <circle cx="574" cy="254" r="7" fill="#dc2626"/>
  </g>

  <rect x="884" y="166" width="236" height="132" rx="24" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
  <text class="tiny" x="918" y="204" fill="#1d4ed8">PROXY</text>
  <text class="label ink" x="918" y="236">Recompensa media</text>
  <text class="small muted" x="918" y="260">Puede subir por rebotes,</text>
  <text class="small muted" x="918" y="280">supervivencia o shaping.</text>

  <rect x="884" y="330" width="236" height="132" rx="24" fill="#fef2f2" stroke="#fecaca" class="shadow"/>
  <text class="tiny" x="918" y="368" fill="#dc2626">LOGRO</text>
  <text class="label ink" x="918" y="400">Exito real</text>
  <text class="small muted" x="918" y="424">Porcentaje de niveles</text>
  <text class="small muted" x="918" y="444">limpiados en test.</text>

  <rect x="210" y="610" width="780" height="42" rx="21" fill="#111827"/>
  <text class="body" x="600" y="638" text-anchor="middle" fill="#fff">La curva azul puede ser cierta y aun asi la conclusion "sabe jugar" ser falsa.</text>
</svg>
