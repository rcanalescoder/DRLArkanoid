<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Checklist de confianza experimental</title>
<desc id="desc">Este capitulo convierte resultados en evidencia reproducible.</desc>
<defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}.line{stroke:#dbe2ea}.white{fill:#fff}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.35px}
      .num{font:900 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker>
  </defs>
<rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="52" y="58">Checklist de confianza experimental</text>
  <text class="body muted" x="52" y="88">Este capitulo convierte resultados en evidencia reproducible.</text>

<g transform="translate(46 140)">
<rect width="204" height="430" rx="22" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#047857">1</text>
<text class="label ink" x="24" y="68">Splits disjuntos</text>
<text class="small muted" x="24" y="108">train, validacion y</text>
<text class="small muted" x="24" y="130">test no comparten</text>
<text class="small muted" x="24" y="152">niveles concretos</text>
<rect x="24" y="372" width="156" height="38" rx="19" fill="#047857"/>
<text class="small" x="102" y="396" text-anchor="middle" fill="#fff">sin fuga</text>
</g>
<g transform="translate(272 140)">
<rect width="204" height="430" rx="22" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#2563eb">2</text>
<text class="label ink" x="24" y="68">Semillas</text>
<text class="small muted" x="24" y="108">media y dispersion</text>
<text class="small muted" x="24" y="130">de runs</text>
<text class="small muted" x="24" y="152">independientes</text>
<rect x="24" y="372" width="156" height="38" rx="19" fill="#2563eb"/>
<text class="small" x="102" y="396" text-anchor="middle" fill="#fff">varianza</text>
</g>
<g transform="translate(498 140)">
<rect width="204" height="430" rx="22" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#d97706">3</text>
<text class="label ink" x="24" y="68">Greedy</text>
<text class="small muted" x="24" y="108">evaluacion sin</text>
<text class="small muted" x="24" y="130">exploracion</text>
<text class="small muted" x="24" y="152">aleatoria</text>
<rect x="24" y="372" width="156" height="38" rx="19" fill="#d97706"/>
<text class="small" x="102" y="396" text-anchor="middle" fill="#fff">examen</text>
</g>
<g transform="translate(724 140)">
<rect width="204" height="430" rx="22" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#7c3aed">4</text>
<text class="label ink" x="24" y="68">Ledger</text>
<text class="small muted" x="24" y="108">cada resultado</text>
<text class="small muted" x="24" y="130">queda trazado a</text>
<text class="small muted" x="24" y="152">configuracion y</text>
<text class="small muted" x="24" y="174">hash</text>
<rect x="24" y="372" width="156" height="38" rx="19" fill="#7c3aed"/>
<text class="small" x="102" y="396" text-anchor="middle" fill="#fff">registro</text>
</g>
<g transform="translate(950 140)">
<rect width="204" height="430" rx="22" fill="#fdf2f8" stroke="#fbcfe8" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#db2777">5</text>
<text class="label ink" x="24" y="68">Oraculo</text>
<text class="small muted" x="24" y="108">solo se examinan</text>
<text class="small muted" x="24" y="130">niveles limpiables</text>
<rect x="24" y="372" width="156" height="38" rx="19" fill="#db2777"/>
<text class="small" x="102" y="396" text-anchor="middle" fill="#fff">justicia</text>
</g>
<rect x="210" y="650" width="780" height="54" rx="27" fill="#111827"/>
<text class="body" x="600" y="683" text-anchor="middle" fill="#fff">La confianza no nace de una grafica bonita, sino de un protocolo cerrado.</text>
</svg>
