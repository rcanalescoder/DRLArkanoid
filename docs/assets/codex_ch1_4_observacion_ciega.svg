<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Observacion del agente ciego</title>
  <desc id="desc">Comparacion entre lo que ve un humano y los seis numeros que recibe el agente ciego.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">El agente ve la bola, pero no ve el objetivo</text>
  <text class="body muted" x="48" y="88">Con seis cinematicos puede interceptar; sin ladrillos no puede decidir a donde apuntar.</text>

  <rect x="78" y="140" width="500" height="410" rx="32" fill="#f8fafc" stroke="#cbd5e1" class="shadow"/>
  <text class="tiny" x="118" y="184" fill="#475569">ESCENA REAL</text>
  <text class="label ink" x="118" y="218">Lo que ve un humano</text>
  <rect x="136" y="258" width="320" height="196" rx="22" fill="#0f172a"/>
  <g fill="#fb7185">
    <rect x="172" y="288" width="44" height="12" rx="4"/><rect x="226" y="288" width="44" height="12" rx="4"/><rect x="280" y="288" width="44" height="12" rx="4"/><rect x="334" y="288" width="44" height="12" rx="4"/>
  </g>
  <g fill="#f59e0b">
    <rect x="172" y="318" width="44" height="12" rx="4"/><rect x="226" y="318" width="44" height="12" rx="4"/><rect x="280" y="318" width="44" height="12" rx="4"/><rect x="334" y="318" width="44" height="12" rx="4"/>
  </g>
  <g fill="#34d399">
    <rect x="172" y="348" width="44" height="12" rx="4"/><rect x="226" y="348" width="44" height="12" rx="4"/><rect x="280" y="348" width="44" height="12" rx="4"/><rect x="334" y="348" width="44" height="12" rx="4"/>
  </g>
  <path d="M216,428 L284,372 L352,420 L424,348" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <circle cx="424" cy="348" r="8" fill="#fff"/>
  <rect x="266" y="444" width="72" height="9" rx="5" fill="#818cf8"/>
  <text class="small muted" x="118" y="500">Bola, pala, ladrillos, huecos</text>
  <text class="small muted" x="118" y="520">y objetivo visible.</text>

  <rect x="622" y="140" width="500" height="410" rx="32" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
  <text class="tiny" x="662" y="184" fill="#1d4ed8">OBSERVACION DEL CIEGO</text>
  <text class="label ink" x="662" y="218">Lo que recibe la politica</text>
  <g transform="translate(678 264)">
    <rect width="360" height="180" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <text class="mono" x="36" y="48" fill="#1d4ed8">x_bola</text>
    <text class="mono" x="146" y="48" fill="#1d4ed8">y_bola</text>
    <text class="mono" x="256" y="48" fill="#1d4ed8">vx</text>
    <text class="mono" x="36" y="104" fill="#1d4ed8">vy</text>
    <text class="mono" x="146" y="104" fill="#1d4ed8">x_pala</text>
    <text class="mono" x="256" y="104" fill="#1d4ed8">paso</text>
    <rect x="28" y="132" width="304" height="28" rx="14" fill="#fee2e2" stroke="#fca5a5"/>
    <text class="mono" x="180" y="151" text-anchor="middle" fill="#dc2626">sin matriz de ladrillos</text>
  </g>
  <text class="small muted" x="662" y="500">Sabe seguir la bola.</text>
  <text class="small muted" x="662" y="520">No sabe que queda por romper.</text>

  <rect x="238" y="614" width="724" height="48" rx="24" fill="#111827"/>
  <text class="body" x="600" y="645" text-anchor="middle" fill="#fff">Ceguera = falta el mapa del objetivo, no falta capacidad de mover la pala.</text>
</svg>
