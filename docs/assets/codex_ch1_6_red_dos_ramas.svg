<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Red de dos ramas</title>
  <desc id="desc">Arquitectura que procesa la matriz 8x10 con convolucion y los seis cinematicos con una rama densa antes de fusionar rasgos.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}.line{stroke:#94a3b8;stroke-width:4;fill:none}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:800 14px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">Ingrediente 4: ver el mapa con su geometria</text>
  <text class="body muted" x="48" y="88">Dos ramas separan lo espacial de lo cinematico y se juntan antes de decidir.</text>

  <g transform="translate(64 136)">
    <rect width="220" height="190" rx="22" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <text class="tiny" x="26" y="36" fill="#1d4ed8">RAMA ESPACIAL</text>
    <text class="label ink" x="26" y="68">Matriz 8x10</text>
    <g transform="translate(42 92)">
      <rect width="136" height="88" rx="12" fill="#fff" stroke="#bfdbfe"/>
      <rect x="18" y="18" width="12" height="12" fill="#2563eb"/><rect x="34" y="18" width="12" height="12" fill="#2563eb"/><rect x="50" y="18" width="12" height="12" fill="#2563eb"/><rect x="66" y="18" width="12" height="12" fill="#2563eb"/><rect x="82" y="18" width="12" height="12" fill="#2563eb"/><rect x="98" y="18" width="12" height="12" fill="#2563eb"/>
      <rect x="18" y="36" width="12" height="12" fill="#93c5fd"/><rect x="50" y="36" width="12" height="12" fill="#93c5fd"/><rect x="82" y="36" width="12" height="12" fill="#93c5fd"/>
      <rect x="34" y="54" width="12" height="12" fill="#60a5fa"/><rect x="66" y="54" width="12" height="12" fill="#60a5fa"/><rect x="98" y="54" width="12" height="12" fill="#60a5fa"/>
      <rect x="42" y="26" width="44" height="44" fill="none" stroke="#f97316" stroke-width="4"/>
    </g>
  </g>
  <g transform="translate(348 158)">
    <rect width="190" height="136" rx="22" fill="#ecfeff" stroke="#bae6fd" class="shadow"/>
    <text class="tiny" x="95" y="38" text-anchor="middle" fill="#0e7490">ENCODER CONV</text>
    <text class="label ink" x="95" y="74" text-anchor="middle">16 -> 32</text>
    <text class="small muted" x="95" y="106" text-anchor="middle">detecta huecos,</text>
    <text class="small muted" x="95" y="128" text-anchor="middle">bordes y bloques</text>
  </g>

  <g transform="translate(64 404)">
    <rect width="220" height="132" rx="22" fill="#f8fafc" stroke="#cbd5e1" class="shadow"/>
    <text class="tiny" x="26" y="36" fill="#475569">RAMA CINEMATICA</text>
    <text class="label ink" x="26" y="68">6 numeros</text>
    <text class="small muted" x="26" y="100">bola, velocidad, pala</text>
  </g>
  <g transform="translate(348 402)">
    <rect width="190" height="136" rx="22" fill="#f8fafc" stroke="#cbd5e1" class="shadow"/>
    <text class="tiny" x="95" y="38" text-anchor="middle" fill="#475569">DENSA</text>
    <text class="label ink" x="95" y="74" text-anchor="middle">rasgos</text>
    <text class="small muted" x="95" y="106" text-anchor="middle">del movimiento</text>
  </g>

  <path class="line" d="M284 230 L338 226" marker-end="url(#arrow)"/>
  <path class="line" d="M284 470 L338 470" marker-end="url(#arrow)"/>
  <path class="line" d="M538 226 C600 250 620 302 658 342" marker-end="url(#arrow)"/>
  <path class="line" d="M538 470 C600 446 620 394 658 356" marker-end="url(#arrow)"/>

  <g transform="translate(664 284)">
    <rect width="150" height="132" rx="22" fill="#fff" stroke="#dbe2ea" class="shadow"/>
    <text class="label ink" x="75" y="58" text-anchor="middle">fusion</text>
    <text class="small muted" x="75" y="90" text-anchor="middle">concatenar</text>
  </g>
  <path class="line" d="M814 350 L880 350" marker-end="url(#arrow)"/>
  <g transform="translate(890 284)">
    <rect width="164" height="132" rx="22" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
    <text class="tiny" x="82" y="38" text-anchor="middle" fill="#6d28d9">CABEZA</text>
    <text class="label ink" x="82" y="72" text-anchor="middle">128 + 128</text>
    <text class="small muted" x="82" y="104" text-anchor="middle">ReLU</text>
  </g>
  <path class="line" d="M1054 350 L1112 350" marker-end="url(#arrow)"/>
  <g transform="translate(1118 270)">
    <circle cx="28" cy="30" r="18" fill="#10b981"/>
    <circle cx="28" cy="80" r="18" fill="#10b981"/>
    <circle cx="28" cy="130" r="18" fill="#10b981"/>
    <text class="mono" x="-18" y="190" text-anchor="middle" fill="#047857">Q o pi</text>
  </g>

  <rect x="242" y="620" width="716" height="50" rx="25" fill="#111827"/>
  <text class="body" x="600" y="652" text-anchor="middle" fill="#fff">El sesgo espacial vale alrededor de 20 puntos frente a aplanar la matriz.</text>
</svg>
