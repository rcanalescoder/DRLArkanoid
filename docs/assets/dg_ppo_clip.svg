<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="ar2563eb" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker><marker id="ar7c3aed" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker><marker id="ardb2777" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker><marker id="ar0891b2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker><marker id="ar0c9f6e" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0c9f6e"/></marker><marker id="ard97706" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker><marker id="ar8a909b" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8a909b"/></marker><marker id="ar11181f" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#11181f"/></marker></defs><rect width="860" height="330" fill="#ffffff"/><text x="40" y="26" text-anchor="start" font-size="13" fill="#11181f" font-weight="600">El recorte de PPO (ventaja A>0): la mejora se 'aplana' si la política cambia demasiado</text><line x1="80" y1="270" x2="760" y2="270" stroke="#8a909b" stroke-width="1.4"/><line x1="80" y1="50" x2="80" y2="270" stroke="#8a909b" stroke-width="1.4"/><rect x="352" y="50" width="136" height="220" fill="#e9fbf4" opacity="0.7"/><text x="420.0" y="44" text-anchor="middle" font-size="11" fill="#0c9f6e" font-weight="700">zona segura [0.8, 1.2]</text><line x1="80.0" y1="270.0" x2="624.0" y2="62.9411764705882" stroke="#8a909b" stroke-width="1.6" stroke-dasharray="5,4"/><text x="630.8000000000001" y="66.9411764705882" text-anchor="start" font-size="11" fill="#8a909b" font-weight="400">sin recorte (ρ·A)</text><polyline points="80,270 488,115 760,115" fill="none" stroke="#0c9f6e" stroke-width="3"/><text x="658.0" y="102.70588235294116" text-anchor="start" font-size="12" fill="#0c9f6e" font-weight="700">con recorte (plano)</text><text x="420.0" y="292" text-anchor="middle" font-size="10" fill="#8a909b" font-weight="400">política igual (ρ=1)</text><text x="80" y="292" text-anchor="start" font-size="10" fill="#8a909b" font-weight="400">ρ=0</text><text x="760" y="292" text-anchor="end" font-size="10" fill="#8a909b" font-weight="400">ρ=2 →</text><text x="40" y="54" text-anchor="start" font-size="10" fill="#8a909b" font-weight="400">objetivo</text><text x="430" y="312" text-anchor="middle" font-size="12" fill="#8a909b" font-weight="400">ρ = π_nueva / π_vieja. Más allá de 1+ε el objetivo no crece: no compensa cambiar mucho de golpe.</text></svg>