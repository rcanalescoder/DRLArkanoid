<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Resultados del agente ciego</title>
  <desc id="desc">Tres resultados del agente ciego: 0 por ciento en dispersos, 2 de 28 ladrillos, y 56 por ciento enganoso en muro lleno.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">Los numeros del ciego: uno alto y dos honestos</text>
  <text class="body muted" x="48" y="88">El 56% solo aparece cuando la densidad permite romper por fisica. En niveles que exigen apuntar, el resultado es cero.</text>

  <g transform="translate(92 152)">
    <rect width="300" height="360" rx="30" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <text class="tiny" x="36" y="44" fill="#1d4ed8">NIVELES DISPERSOS</text>
    <text class="label ink" x="36" y="82">Exito real</text>
    <text class="title" x="36" y="154" fill="#2563eb">0%</text>
    <text class="small muted" x="36" y="194">Cuando hay huecos,</text>
    <text class="small muted" x="36" y="214">hay que apuntar.</text>
    <rect x="56" y="248" width="180" height="86" rx="18" fill="#0f172a"/>
    <rect x="84" y="272" width="24" height="10" rx="4" fill="#fb7185"/>
    <rect x="152" y="286" width="24" height="10" rx="4" fill="#34d399"/>
    <rect x="194" y="308" width="24" height="10" rx="4" fill="#f59e0b"/>
  </g>

  <g transform="translate(450 152)">
    <rect width="300" height="360" rx="30" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <text class="tiny" x="36" y="44" fill="#c2410c">DESTRUCCION MEDIA</text>
    <text class="label ink" x="36" y="82">Poca pared cae</text>
    <text class="title" x="36" y="154" fill="#f97316">2 / 28</text>
    <text class="small muted" x="36" y="194">Apenas un 7%</text>
    <text class="small muted" x="36" y="214">del muro antiguo.</text>
    <rect x="56" y="248" width="180" height="86" rx="18" fill="#0f172a"/>
    <g fill="#64748b">
      <rect x="76" y="270" width="24" height="10" rx="4"/><rect x="108" y="270" width="24" height="10" rx="4"/><rect x="140" y="270" width="24" height="10" rx="4"/><rect x="172" y="270" width="24" height="10" rx="4"/>
      <rect x="76" y="292" width="24" height="10" rx="4"/><rect x="108" y="292" width="24" height="10" rx="4"/>
    </g>
    <rect x="204" y="292" width="24" height="10" rx="4" fill="#f97316"/>
    <rect x="76" y="314" width="24" height="10" rx="4" fill="#f97316"/>
  </g>

  <g transform="translate(808 152)">
    <rect width="300" height="360" rx="30" fill="#fef2f2" stroke="#fecaca" class="shadow"/>
    <text class="tiny" x="36" y="44" fill="#dc2626">REJILLA LLENA</text>
    <text class="label ink" x="36" y="82">Numero tramposo</text>
    <text class="title" x="36" y="154" fill="#dc2626">56%</text>
    <text class="small muted" x="36" y="194">La bola toca algo</text>
    <text class="small muted" x="36" y="214">por acumulacion.</text>
    <rect x="56" y="248" width="180" height="86" rx="18" fill="#0f172a"/>
    <g fill="#fb7185"><rect x="76" y="270" width="24" height="8" rx="3"/><rect x="108" y="270" width="24" height="8" rx="3"/><rect x="140" y="270" width="24" height="8" rx="3"/><rect x="172" y="270" width="24" height="8" rx="3"/></g>
    <g fill="#f59e0b"><rect x="76" y="288" width="24" height="8" rx="3"/><rect x="108" y="288" width="24" height="8" rx="3"/><rect x="140" y="288" width="24" height="8" rx="3"/><rect x="172" y="288" width="24" height="8" rx="3"/></g>
    <g fill="#34d399"><rect x="76" y="306" width="24" height="8" rx="3"/><rect x="108" y="306" width="24" height="8" rx="3"/><rect x="140" y="306" width="24" height="8" rx="3"/><rect x="172" y="306" width="24" height="8" rx="3"/></g>
  </g>

  <rect x="244" y="610" width="712" height="48" rx="24" fill="#111827"/>
  <text class="body" x="600" y="641" text-anchor="middle" fill="#fff">El dato honesto es el 0% cuando el tablero exige punteria.</text>
</svg>
