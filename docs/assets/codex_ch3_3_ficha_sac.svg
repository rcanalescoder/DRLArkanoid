<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">SAC en una ficha funcional</title>
<desc id="desc">SAC intenta ganar sin perder diversidad de accion demasiado pronto.</desc>
<defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}.line{stroke:#dbe2ea}.white{fill:#fff}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.35px}
      .num{font:900 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker>
  </defs>
<rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="52" y="58">SAC en una ficha funcional</text>
  <text class="body muted" x="52" y="88">SAC intenta ganar sin perder diversidad de accion demasiado pronto.</text>

<g transform="translate(67 140)">
<rect width="250" height="310" rx="22" fill="#fdf2f8" stroke="#fbcfe8" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#db2777">IDEA</text>
<text class="label ink" x="24" y="68">Max entropy</text>
<text class="small muted" x="24" y="108">optimiza retorno y</text>
<text class="small muted" x="24" y="130">entropia de la politica a</text>
<text class="small muted" x="24" y="152">la vez</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#db2777"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">variedad</text>
</g>
<g transform="translate(339 140)">
<rect width="250" height="310" rx="22" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#d97706">ALFA</text>
<text class="label ink" x="24" y="68">Temperatura</text>
<text class="small muted" x="24" y="108">controla cuanto valor</text>
<text class="small muted" x="24" y="130">damos a mantener opciones</text>
<text class="small muted" x="24" y="152">abiertas</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#d97706"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">termostato</text>
</g>
<g transform="translate(611 140)">
<rect width="250" height="310" rx="22" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#2563eb">CRITICOS</text>
<text class="label ink" x="24" y="68">Valor robusto</text>
<text class="small muted" x="24" y="108">usa criticos para evaluar</text>
<text class="small muted" x="24" y="130">acciones y reducir</text>
<text class="small muted" x="24" y="152">optimismo</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#2563eb"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">off-policy</text>
</g>
<g transform="translate(883 140)">
<rect width="250" height="310" rx="22" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#047857">LECTURA</text>
<text class="label ink" x="24" y="68">Dos variantes</text>
<text class="small muted" x="24" y="108">pure y hybrid no deben</text>
<text class="small muted" x="24" y="130">mezclarse en una sola</text>
<text class="small muted" x="24" y="152">conclusion</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#047857"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">honestidad</text>
</g>
<rect x="210" y="650" width="780" height="54" rx="27" fill="#111827"/>
<text class="body" x="600" y="683" text-anchor="middle" fill="#fff">En esta tarea, la variante importa tanto como el nombre SAC.</text>
</svg>
