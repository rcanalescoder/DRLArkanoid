<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">La receta completa antes de los ingredientes</title>
  <desc id="desc">Cinco cambios de formulacion convierten el problema ciego en una tarea aprendible.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .num{font:900 38px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="48" y="58">La receta completa antes de entrar en ingredientes</text>
  <text class="body muted" x="48" y="88">No fue un algoritmo magico: fue convertir una tarea imposible en una tarea observable, medible y justa.</text>

  <g transform="translate(70 128)">
    <rect width="260" height="116" rx="22" fill="#fef2f2" stroke="#fecaca" class="shadow"/>
    <text class="tiny" x="28" y="36" fill="#dc2626">ANTES</text>
    <text class="num" x="28" y="78" fill="#dc2626">0%</text>
    <text class="small muted" x="112" y="70">ciego en</text>
    <text class="small muted" x="112" y="92">dispersos</text>
  </g>
  <path d="M350 186 C430 186 442 186 520 186" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text class="label" x="435" y="160" text-anchor="middle" fill="#0e7490">reformular</text>
  <text class="small muted" x="435" y="212" text-anchor="middle">no cambiar de motor</text>
  <g transform="translate(870 128)">
    <rect width="260" height="116" rx="22" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <text class="tiny" x="28" y="36" fill="#047857">DESPUES</text>
    <text class="num" x="28" y="78" fill="#047857">91%</text>
    <text class="small muted" x="118" y="70">PPO en</text>
    <text class="small muted" x="118" y="92">TEST-ID</text>
  </g>

  <g transform="translate(72 318)">
    <rect width="200" height="190" rx="22" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <text class="tiny" x="24" y="36" fill="#c2410c">1 - TIEMPO</text>
    <text class="label ink" x="24" y="68">Reloj justo</text>
    <text class="small muted" x="24" y="106">90 pasos</text>
    <text class="small muted" x="24" y="128">por ladrillo.</text>
    <text class="tiny" x="24" y="164" fill="#c2410c">SI FALTA: -23,5</text>
  </g>
  <g transform="translate(292 318)">
    <rect width="200" height="190" rx="22" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
    <text class="tiny" x="24" y="36" fill="#6d28d9">2 - META</text>
    <text class="label ink" x="24" y="68">Meta limpia</text>
    <text class="small muted" x="24" y="106">Fuera shaping</text>
    <text class="small muted" x="24" y="128">Phi.</text>
    <text class="tiny" x="24" y="164" fill="#6d28d9">QUITARLO: +8,0</text>
  </g>
  <g transform="translate(512 318)">
    <rect width="200" height="190" rx="22" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <text class="tiny" x="24" y="36" fill="#1d4ed8">3 - VISTA</text>
    <text class="label ink" x="24" y="68">Matriz 8x10</text>
    <text class="small muted" x="24" y="106">80 celdas:</text>
    <text class="small muted" x="24" y="128">ladrillo o hueco.</text>
    <text class="tiny" x="24" y="164" fill="#1d4ed8">CRITICO</text>
  </g>
  <g transform="translate(732 318)">
    <rect width="200" height="190" rx="22" fill="#ecfeff" stroke="#bae6fd" class="shadow"/>
    <text class="tiny" x="24" y="36" fill="#0e7490">4 - ESTRUCTURA</text>
    <text class="label ink" x="24" y="68">Encoder conv</text>
    <text class="small muted" x="24" y="106">Respeta</text>
    <text class="small muted" x="24" y="128">vecindad.</text>
    <text class="tiny" x="24" y="164" fill="#0e7490">SI FALTA: -20,4</text>
  </g>
  <g transform="translate(952 318)">
    <rect width="200" height="190" rx="22" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <text class="tiny" x="24" y="36" fill="#047857">5 - VARIEDAD</text>
    <text class="label ink" x="24" y="68">Generador</text>
    <text class="small muted" x="24" y="106">Train, valid</text>
    <text class="small muted" x="24" y="128">y test disjuntos.</text>
    <text class="tiny" x="24" y="164" fill="#047857">HACE CREIBLE</text>
  </g>

  <rect x="190" y="626" width="820" height="58" rx="29" fill="#111827"/>
  <text class="body" x="600" y="650" text-anchor="middle" fill="#fff">Idea clave: las piezas estan acopladas.</text>
  <text class="small" x="600" y="674" text-anchor="middle" fill="#cbd5e1">No copies un ingrediente aislado sin volver a medir la receta completa.</text>
</svg>
