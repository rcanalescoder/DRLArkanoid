<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Resumen visual del contrato de lectura</title>
  <desc id="desc">Infografia final del capitulo Como leer esta guia: ruta, herramientas, secuencia y honestidad.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.5px}
      .num{font:800 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="48" y="58">Antes de seguir: el contrato visual del libro</text>
  <text class="body muted" x="48" y="88">Si recuerdas esta ficha, ya sabes como navegar cualquier capitulo posterior.</text>

  <rect x="74" y="136" width="496" height="214" rx="28" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
  <circle cx="126" cy="190" r="28" fill="#2563eb"/>
  <text class="num" x="126" y="198" text-anchor="middle" fill="#fff">1</text>
  <text class="tiny" x="174" y="174" fill="#1d4ed8">RUTA</text>
  <text class="label ink" x="174" y="204">Elige el zoom</text>
  <text class="small muted" x="174" y="230">Primera pasada: intuicion.</text>
  <text class="small muted" x="174" y="250">Construccion: baja a codigo.</text>
  <text class="small muted" x="174" y="270">Auditoria: baja a protocolo.</text>
  <rect x="174" y="276" width="82" height="24" rx="12" fill="#bfdbfe"/>
  <rect x="268" y="276" width="112" height="24" rx="12" fill="#a5f3fc"/>
  <rect x="392" y="276" width="116" height="24" rx="12" fill="#86efac"/>

  <rect x="630" y="136" width="496" height="214" rx="28" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
  <circle cx="682" cy="190" r="28" fill="#d97706"/>
  <text class="num" x="682" y="198" text-anchor="middle" fill="#fff">2</text>
  <text class="tiny" x="730" y="174" fill="#b45309">HERRAMIENTAS</text>
  <text class="label ink" x="730" y="204">Usa las cajas por funcion</text>
  <text class="small muted" x="730" y="230">Azul prepara, cian aterriza,</text>
  <text class="small muted" x="730" y="250">rojo avisa, gris delimita,</text>
  <text class="small muted" x="730" y="270">verde cierra, violeta practica.</text>
  <rect x="730" y="276" width="38" height="24" rx="8" fill="#bfdbfe"/>
  <rect x="780" y="276" width="38" height="24" rx="8" fill="#a5f3fc"/>
  <rect x="830" y="276" width="38" height="24" rx="8" fill="#fecaca"/>
  <rect x="880" y="276" width="38" height="24" rx="8" fill="#cbd5e1"/>
  <rect x="930" y="276" width="38" height="24" rx="8" fill="#86efac"/>
  <rect x="980" y="276" width="38" height="24" rx="8" fill="#c4b5fd"/>

  <rect x="74" y="404" width="496" height="214" rx="28" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
  <circle cx="126" cy="458" r="28" fill="#7c3aed"/>
  <text class="num" x="126" y="466" text-anchor="middle" fill="#fff">3</text>
  <text class="tiny" x="174" y="442" fill="#6d28d9">SECUENCIA</text>
  <text class="label ink" x="174" y="472">Reconoce la coreografia</text>
  <text class="small muted" x="174" y="498">Pregunta -> mecanismo -> codigo</text>
  <text class="small muted" x="174" y="518">-> resultado -> juicio.</text>
  <text class="small muted" x="174" y="538">El orden evita saltos bruscos.</text>
  <line x1="174" y1="554" x2="492" y2="554" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="194" cy="554" r="13" fill="#2563eb"/>
  <circle cx="268" cy="554" r="13" fill="#7c3aed"/>
  <circle cx="342" cy="554" r="13" fill="#0891b2"/>
  <circle cx="416" cy="554" r="13" fill="#0f9f6e"/>

  <rect x="630" y="404" width="496" height="214" rx="28" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
  <circle cx="682" cy="458" r="28" fill="#0f9f6e"/>
  <text class="num" x="682" y="466" text-anchor="middle" fill="#fff">4</text>
  <text class="tiny" x="730" y="442" fill="#047857">HONESTIDAD</text>
  <text class="label ink" x="730" y="472">No leas cifras sin condiciones</text>
  <text class="small muted" x="730" y="498">Distingue recompensa de exito,</text>
  <text class="small muted" x="730" y="518">validacion de test y una semilla</text>
  <text class="small muted" x="730" y="538">de evidencia reproducible.</text>
  <rect x="730" y="562" width="104" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
  <text class="small" x="782" y="581" text-anchor="middle" fill="#047857">split</text>
  <rect x="850" y="562" width="104" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
  <text class="small" x="902" y="581" text-anchor="middle" fill="#047857">semillas</text>
  <rect x="970" y="562" width="104" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
  <text class="small" x="1022" y="581" text-anchor="middle" fill="#047857">test</text>

  <rect x="170" y="668" width="860" height="44" rx="22" fill="#111827"/>
  <text class="body" x="600" y="696" text-anchor="middle" fill="#ffffff">Leer bien = elegir ruta + usar ayudas + seguir el flujo + exigir contexto.</text>
</svg>
