<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">WM-RNN en una ficha funcional</title>
<desc id="desc">Anadir memoria parece natural, pero aqui no mejora el resultado.</desc>
<defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}.line{stroke:#dbe2ea}.white{fill:#fff}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.35px}
      .num{font:900 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker>
  </defs>
<rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="52" y="58">WM-RNN en una ficha funcional</text>
  <text class="body muted" x="52" y="88">Anadir memoria parece natural, pero aqui no mejora el resultado.</text>

<g transform="translate(67 140)">
<rect width="250" height="310" rx="22" fill="#ecfeff" stroke="#bae6fd" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#0891b2">IDEA</text>
<text class="label ink" x="24" y="68">Modelo con contexto</text>
<text class="small muted" x="24" y="108">la LSTM arrastra un</text>
<text class="small muted" x="24" y="130">estado oculto entre pasos</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#0891b2"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">memoria</text>
</g>
<g transform="translate(339 140)">
<rect width="250" height="310" rx="22" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#d97706">COSTE</text>
<text class="label ink" x="24" y="68">Secuencias</text>
<text class="small muted" x="24" y="108">entrenar ya no usa puntos</text>
<text class="small muted" x="24" y="130">aislados sino ventanas</text>
<text class="small muted" x="24" y="152">temporales</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#d97706"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">complejidad</text>
</g>
<g transform="translate(611 140)">
<rect width="250" height="310" rx="22" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#047857">CUANDO AYUDA</text>
<text class="label ink" x="24" y="68">Observacion parcial</text>
<text class="small muted" x="24" y="108">si falta informacion</text>
<text class="small muted" x="24" y="130">actual, la historia puede</text>
<text class="small muted" x="24" y="152">reconstruirla</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#047857"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">POMDP</text>
</g>
<g transform="translate(883 140)">
<rect width="250" height="310" rx="22" fill="#fdf2f8" stroke="#fbcfe8" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#db2777">AQUI</text>
<text class="label ink" x="24" y="68">Hallazgo negativo</text>
<text class="small muted" x="24" y="108">la matriz 8x10 ya hace el</text>
<text class="small muted" x="24" y="130">estado casi suficiente</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#db2777"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">35%</text>
</g>
<rect x="210" y="650" width="780" height="54" rx="27" fill="#111827"/>
<text class="body" x="600" y="683" text-anchor="middle" fill="#fff">Mas memoria no es automaticamente mas inteligencia.</text>
</svg>
