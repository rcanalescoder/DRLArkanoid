l="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="52" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" fill="#b45309">Shaping Φ</text><text x="52" y="162" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">premia «pala cerca de la</text><text x="52" y="175" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">bola»</text><line x1="202" y1="150" x2="220" y2="150" stroke="#b45309" stroke-width="2.6" marker-end="url(#ah-b45309)"/><rect x="222" y="110" width="160" height="80" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="234" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" fill="#b45309">Rebote vertical</text><text x="234" y="162" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">la bola sube recta</text><line x1="384" y1="150" x2="402" y2="150" stroke="#b45309" stroke-width="2.6" marker-end="url(#ah-b45309)"/><rect x="404" y="110" width="160" height="80" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="416" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" fill="#b45309">Sobrevive</text><text x="416" y="162" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">muchos pasos vivos</text><line x1="566" y1="150" x2="584" y2="150" stroke="#b45309" stroke-width="2.6" marker-end="url(#ah-b45309)"/><rect x="586" y="110" width="160" height="80" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="598" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" fill="#b45309">Menos puntería</text><text x="598" y="162" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">no busca ladrillos</text><line x1="748" y1="150" x2="766" y2="150" stroke="#b45309" stroke-width="2.6" marker-end="url(#ah-b45309)"/><rect x="768" y="110" width="160" height="80" rx="10" fill="#fff7ed" stroke="#b91c1c" stroke-width="1.5"/><text x="780" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" fill="#b91c1c">Baja limpieza</text><text x="780" y="162" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">no gana el nivel</text><rect x="40" y="214" width="900" height="52" rx="10" fill="#f0fdf9" stroke="#0c9f6e" stroke-width="1.5"/><text x="60" y="238" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" text-anchor="start" fill="#0a6b4e">Quitar Φ → +8 puntos de éxito.</text><text x="285" y="238" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" fill="#1f2937">A veces, la mejor ayuda es no ayudar: deja que la recompensa real (ganar) guíe.</text></svg>