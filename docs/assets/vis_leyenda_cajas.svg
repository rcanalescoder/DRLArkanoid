9" fill="#eff4fe" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="86" width="5" height="48" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="56" y="106" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" fill="#2563eb">Antes de la fórmula</text><text x="56" y="123" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">qué calcula, en palabras</text><rect x="352" y="86" width="300" height="48" rx="9" fill="#ecfeff" stroke="#0e7490" stroke-width="1.4"/><rect x="352" y="86" width="5" height="48" rx="0" fill="#0e7490" stroke="#0e7490" stroke-width="0"/><text x="368" y="106" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" fill="#0e7490">Traducción al juego</text><text x="368" y="123" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">cómo se ve en Arkanoid</text><rect x="664" y="86" width="300" height="48" rx="9" fill="#fff8ec" stroke="#b45309" stroke-width="1.4"/><rect x="664" y="86" width="5" height="48" rx="0" fill="#b45309" stroke="#b45309" stroke-width="0"/><text x="680" y="106" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" fill="#b45309">Error común</text><text x="680" y="123" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">la confusión típica</text><rect x="40" y="144" width="300" height="48" rx="9" fill="#fff8ec" stroke="#b45309" stroke-width="1.4"/><rect x="40" y="144" width="5" height="48" rx="0" fill="#b45309" stroke="#b45309" stroke-width="0"/><text x="56" y="164" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5"