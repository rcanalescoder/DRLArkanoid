<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">La primera conquista del agente con vision</title>
  <desc id="desc">Doble panel narrativo que compara el agente ciego con el agente con vision y barras de exito TEST-ID.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}.line{stroke:#dbe2ea}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .num{font:900 44px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .pct{font:900 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="52" y="58">La conquista: de sobrevivir sin ver, a limpiar apuntando</text>
  <text class="body muted" x="52" y="88">No compares solo barras: compara la informacion disponible y el contrato de evaluacion.</text>

  <g transform="translate(54 126)">
    <rect width="438" height="520" rx="26" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <text class="tiny" x="28" y="42" fill="#c2410c">ANTES - ERA CIEGA</text>
    <text class="label ink" x="28" y="76">6 numeros, ningun ladrillo</text>
    <text class="small muted" x="28" y="106">Puede interceptar la bola, pero no elegir</text>
    <text class="small muted" x="28" y="128">hacia que hueco o ladrillo apuntar.</text>

    <g transform="translate(42 168)">
      <rect width="186" height="180" rx="16" fill="#fff" stroke="#fed7aa"/>
      <text class="tiny" x="20" y="30" fill="#c2410c">OBSERVACION</text>
      <text class="label ink" x="20" y="64">bola + pala</text>
      <circle cx="64" cy="104" r="13" fill="#ef4444"/>
      <rect x="92" y="132" width="58" height="12" rx="6" fill="#0e7490"/>
      <text class="small muted" x="20" y="164">sin matriz 4x7</text>
    </g>
    <g transform="translate(250 168)">
      <rect width="146" height="180" rx="16" fill="#fff" stroke="#fed7aa"/>
      <text class="tiny" x="20" y="30" fill="#c2410c">RESULTADO</text>
      <text class="num" x="20" y="82" fill="#be123c">0%</text>
      <text class="small muted" x="20" y="116">exito en</text>
      <text class="small muted" x="20" y="138">dispersos</text>
      <text class="small muted" x="20" y="160">~2/28 rotos</text>
    </g>

    <g transform="translate(42 386)">
      <rect width="354" height="82" rx="18" fill="#fff" stroke="#fed7aa"/>
      <text class="tiny" x="20" y="28" fill="#c2410c">LECTURA SANA</text>
      <text class="small muted" x="20" y="54">Aprendia supervivencia, no punteria.</text>
      <text class="small muted" x="20" y="74">La informacion que faltaba no se inventa.</text>
    </g>
  </g>

  <g transform="translate(524 126)">
    <rect width="622" height="520" rx="26" fill="#ecfeff" stroke="#bae6fd" class="shadow"/>
    <text class="tiny" x="28" y="42" fill="#0e7490">DESPUES - AGENTE CON VISION</text>
    <text class="label ink" x="28" y="76">86 numeros: cinetica + matriz 8x10</text>
    <text class="small muted" x="28" y="106">TEST-ID, greedy, 1,5M pasos, media de 5 semillas.</text>

    <g transform="translate(36 142)">
      <line x1="0" y1="310" x2="540" y2="310" class="line" stroke-width="2"/>
      <line x1="0" y1="232" x2="540" y2="232" class="line" stroke-width="1"/>
      <line x1="0" y1="154" x2="540" y2="154" class="line" stroke-width="1"/>
      <line x1="0" y1="76" x2="540" y2="76" class="line" stroke-width="1"/>
      <text class="tiny muted" x="0" y="324">0</text>
      <text class="tiny muted" x="0" y="246">25</text>
      <text class="tiny muted" x="0" y="168">50</text>
      <text class="tiny muted" x="0" y="90">75</text>

      <g transform="translate(48 28)">
        <rect x="0" y="0" width="76" height="282" rx="10" fill="#7c3aed"/>
        <text class="pct ink" x="38" y="-10" text-anchor="middle">91%</text>
      </g>
      <g transform="translate(150 72)">
        <rect x="0" y="0" width="76" height="238" rx="10" fill="#2563eb"/>
        <text class="pct ink" x="38" y="-10" text-anchor="middle">77%</text>
      </g>
      <g transform="translate(252 122)">
        <rect x="0" y="0" width="76" height="188" rx="10" fill="#db2777"/>
        <text class="pct ink" x="38" y="-10" text-anchor="middle">61%</text>
      </g>
      <g transform="translate(354 140)">
        <rect x="0" y="0" width="76" height="170" rx="10" fill="#d97706"/>
        <text class="pct ink" x="38" y="-10" text-anchor="middle">55%</text>
      </g>
      <g transform="translate(456 202)">
        <rect x="0" y="0" width="76" height="108" rx="10" fill="#0891b2"/>
        <text class="pct ink" x="38" y="-10" text-anchor="middle">35%</text>
      </g>
      <text class="small ink" x="86" y="356" text-anchor="middle">PPO</text>
      <text class="small ink" x="188" y="356" text-anchor="middle">DQN</text>
      <text class="small ink" x="290" y="356" text-anchor="middle">SAC-H</text>
      <text class="small ink" x="392" y="356" text-anchor="middle">WM</text>
      <text class="small ink" x="494" y="356" text-anchor="middle">WM-RNN</text>
    </g>
  </g>

  <g transform="translate(154 678)">
    <rect width="892" height="48" rx="24" fill="#111827"/>
    <text class="body" x="446" y="31" text-anchor="middle" fill="#fff">El mensaje no es que PPO sea alto: es que el panel derecho existe.</text>
  </g>
</svg>
