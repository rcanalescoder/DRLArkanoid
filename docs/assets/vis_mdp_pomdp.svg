stroke="#0c9f6e" stroke-width="1.6"/><text x="80" y="118" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#0a6b4e">MDP — observable</text><text x="80" y="144" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#1f2937">la observación = el estado</text><text x="80" y="166" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#6b7280">todo lo relevante está a la vista</text><text x="80" y="200" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">Arkanoid con matriz 8×10:</text><text x="80" y="220" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#6b7280">ve ladrillos y velocidad → casi markoviano</text><rect x="520" y="90" width="400" height="170" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/><text x="540" y="118" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#b91c1c">POMDP — parcial</text><text x="540" y="144" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#1f2937">la observación oculta información</text><text x="540" y="166" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#6b7280">el agente «ve con rendijas»</text><text x="540" y="200" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">Agente ciego (sin ladrillos):</text><text x="540" y="220" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#6b7280">techo de INFORMACIÓN, no de cómputo</text></svg>