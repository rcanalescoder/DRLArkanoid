<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Cuatro lecciones que sobreviven al proyecto</title>
<desc id="desc">Estas reglas sirven mas alla de Arkanoid.</desc>
<defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}.line{stroke:#dbe2ea}.white{fill:#fff}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.35px}
      .num{font:900 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker>
  </defs>
<rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="52" y="58">Cuatro lecciones que sobreviven al proyecto</text>
  <text class="body muted" x="52" y="88">Estas reglas sirven mas alla de Arkanoid.</text>

<g transform="translate(67 140)">
<rect width="250" height="310" rx="22" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#2563eb">1</text>
<text class="label ink" x="24" y="68">Estado manda</text>
<text class="small muted" x="24" y="108">lo que no entra en s no</text>
<text class="small muted" x="24" y="130">puede guiar la decision</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#2563eb"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">observacion</text>
</g>
<g transform="translate(339 140)">
<rect width="250" height="310" rx="22" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#047857">2</text>
<text class="label ink" x="24" y="68">Exito no es reward</text>
<text class="small muted" x="24" y="108">la recompensa entrena; la</text>
<text class="small muted" x="24" y="130">metrica externa juzga</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#047857"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">objetivo</text>
</g>
<g transform="translate(611 140)">
<rect width="250" height="310" rx="22" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#d97706">3</text>
<text class="label ink" x="24" y="68">Test se protege</text>
<text class="small muted" x="24" y="108">validar no es declarar</text>
<text class="small muted" x="24" y="130">resultado final</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#d97706"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">split</text>
</g>
<g transform="translate(883 140)">
<rect width="250" height="310" rx="22" fill="#fdf2f8" stroke="#fbcfe8" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#db2777">4</text>
<text class="label ink" x="24" y="68">Varianza importa</text>
<text class="small muted" x="24" y="108">una run brillante no</text>
<text class="small muted" x="24" y="130">sustituye a semillas</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#db2777"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">evidencia</text>
</g>
<rect x="210" y="650" width="780" height="54" rx="27" fill="#111827"/>
<text class="body" x="600" y="683" text-anchor="middle" fill="#fff">Buen RL es tanto diseno de tarea como algoritmo.</text>
</svg>
