<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Que mirar cuando abres la app</title>
<desc id="desc">La demo no sustituye al protocolo, pero ayuda a ver mecanismos.</desc>
<defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}.line{stroke:#dbe2ea}.white{fill:#fff}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.35px}
      .num{font:900 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker>
  </defs>
<rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="52" y="58">Que mirar cuando abres la app</text>
  <text class="body muted" x="52" y="88">La demo no sustituye al protocolo, pero ayuda a ver mecanismos.</text>

<g transform="translate(67 140)">
<rect width="250" height="310" rx="22" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#047857">TABLERO</text>
<text class="label ink" x="24" y="68">Partida visible</text>
<text class="small muted" x="24" y="108">bola, pala y ladrillos</text>
<text class="small muted" x="24" y="130">muestran si el agente</text>
<text class="small muted" x="24" y="152">apunta o solo sobrevive</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#047857"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">conducta</text>
</g>
<g transform="translate(339 140)">
<rect width="250" height="310" rx="22" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#2563eb">SELECTOR</text>
<text class="label ink" x="24" y="68">Algoritmo</text>
<text class="small muted" x="24" y="108">cada metodo activa una</text>
<text class="small muted" x="24" y="130">familia mental distinta</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#2563eb"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">contexto</text>
</g>
<g transform="translate(611 140)">
<rect width="250" height="310" rx="22" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#d97706">CONTROLES</text>
<text class="label ink" x="24" y="68">Velocidad y entornos</text>
<text class="small muted" x="24" y="108">separan juego observado</text>
<text class="small muted" x="24" y="130">de entrenamiento headless</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#d97706"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">flujo</text>
</g>
<g transform="translate(883 140)">
<rect width="250" height="310" rx="22" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#7c3aed">CURVAS</text>
<text class="label ink" x="24" y="68">Senales en vivo</text>
<text class="small muted" x="24" y="108">recompensa, exito y ruido</text>
<text class="small muted" x="24" y="130">sirven para diagnosticar,</text>
<text class="small muted" x="24" y="152">no para declarar test</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#7c3aed"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">lectura</text>
</g>
<rect x="210" y="650" width="780" height="54" rx="27" fill="#111827"/>
<text class="body" x="600" y="683" text-anchor="middle" fill="#fff">La app sirve para entender; el veredicto sigue estando en el protocolo.</text>
</svg>
