<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Protocolo train validacion test</title>
  <desc id="desc">Infografia que separa generador, entrenamiento, validacion y test, indicando que decision permite cada conjunto.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">El examen se disena antes de mirar notas</text>
  <text class="body muted" x="48" y="88">Train aprende, validacion decide y test declara. Si se mezclan, el numero deja de medir generalizacion.</text>

  <rect x="62" y="168" width="212" height="288" rx="28" fill="#f8fafc" stroke="#cbd5e1" class="shadow"/>
  <text class="tiny muted" x="96" y="210">GENERADOR</text>
  <text class="label ink" x="96" y="242">Niveles 8x10</text>
  <text class="small muted" x="96" y="272">Fabrica muchas</text>
  <text class="small muted" x="96" y="292">instancias nuevas.</text>
  <g transform="translate(96 322)">
    <rect width="112" height="82" rx="14" fill="#0f172a"/>
    <g fill="#fb7185">
      <rect x="16" y="16" width="16" height="8" rx="3"/><rect x="42" y="16" width="16" height="8" rx="3"/><rect x="68" y="16" width="16" height="8" rx="3"/>
    </g>
    <g fill="#38bdf8">
      <rect x="28" y="34" width="16" height="8" rx="3"/><rect x="58" y="34" width="16" height="8" rx="3"/><rect x="82" y="52" width="16" height="8" rx="3"/>
    </g>
    <rect x="24" y="64" width="56" height="6" rx="3" fill="#818cf8"/>
  </g>

  <line x1="284" y1="312" x2="334" y2="312" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(340 144)">
    <rect width="226" height="356" rx="30" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <circle cx="44" cy="44" r="22" fill="#2563eb"/><text class="label" x="44" y="51" text-anchor="middle" fill="#fff">1</text>
    <text class="tiny" x="84" y="36" fill="#1d4ed8">TRAIN</text>
    <text class="label ink" x="36" y="88">Aprende pesos</text>
    <text class="small muted" x="36" y="120">Lo ve el agente</text>
    <text class="small muted" x="36" y="140">durante miles de</text>
    <text class="small muted" x="36" y="160">partidas.</text>
    <rect x="36" y="206" width="154" height="42" rx="21" fill="#dbeafe" stroke="#93c5fd"/>
    <text class="mono" x="113" y="232" text-anchor="middle" fill="#1d4ed8">ajustar red</text>
    <text class="small muted" x="36" y="294">Aqui ocurre la mejora.</text>
  </g>

  <g transform="translate(610 144)">
    <rect width="226" height="356" rx="30" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <circle cx="44" cy="44" r="22" fill="#f97316"/><text class="label" x="44" y="51" text-anchor="middle" fill="#fff">2</text>
    <text class="tiny" x="84" y="36" fill="#c2410c">VALIDACION</text>
    <text class="label ink" x="36" y="88">Toma decisiones</text>
    <text class="small muted" x="36" y="120">La miramos durante</text>
    <text class="small muted" x="36" y="140">el desarrollo.</text>
    <rect x="36" y="206" width="154" height="42" rx="21" fill="#ffedd5" stroke="#fdba74"/>
    <text class="mono" x="113" y="232" text-anchor="middle" fill="#c2410c">elegir receta</text>
    <text class="small muted" x="36" y="294">Se gasta al usarla.</text>
  </g>

  <g transform="translate(880 144)">
    <rect width="226" height="356" rx="30" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <circle cx="44" cy="44" r="22" fill="#059669"/><text class="label" x="44" y="51" text-anchor="middle" fill="#fff">3</text>
    <text class="tiny" x="84" y="36" fill="#047857">TEST</text>
    <text class="label ink" x="36" y="88">Declara resultado</text>
    <text class="small muted" x="36" y="120">Se mira al final,</text>
    <text class="small muted" x="36" y="140">una vez congelado</text>
    <text class="small muted" x="36" y="160">el protocolo.</text>
    <rect x="36" y="206" width="154" height="42" rx="21" fill="#d1fae5" stroke="#86efac"/>
    <text class="mono" x="113" y="232" text-anchor="middle" fill="#047857">reportar nota</text>
    <text class="small muted" x="36" y="294">Es el juez imparcial.</text>
  </g>

  <line x1="566" y1="312" x2="602" y2="312" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="836" y1="312" x2="872" y2="312" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="590" width="660" height="48" rx="24" fill="#111827"/>
  <text class="body" x="600" y="621" text-anchor="middle" fill="#fff">Regla de oro: ningun nivel de test guia el entrenamiento ni nuestras decisiones.</text>
</svg>
