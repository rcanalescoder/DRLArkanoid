<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cierre visual de la Parte I</title>
  <desc id="desc">Checklist de lectura honesta antes de creer un resultado de aprendizaje por refuerzo.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .big{font:900 58px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="52" y="58">Ficha de cierre: que aprendimos antes de abrir algoritmos</text>
  <text class="body muted" x="52" y="88">Un junior deberia poder revisar cualquier resultado de RL con estas cuatro preguntas.</text>

  <g transform="translate(70 140)">
    <rect width="250" height="210" rx="24" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <text class="big" x="28" y="78" fill="#2563eb">1</text>
    <text class="tiny" x="28" y="114" fill="#2563eb">QUE VE?</text>
    <text class="label ink" x="28" y="148">Estado</text>
    <text class="small muted" x="28" y="178">Sin ladrillos en s,</text>
    <text class="small muted" x="28" y="202">no hay punteria.</text>
  </g>

  <g transform="translate(350 140)">
    <rect width="250" height="210" rx="24" fill="#fdf2f8" stroke="#fbcfe8" class="shadow"/>
    <text class="big" x="28" y="78" fill="#db2777">2</text>
    <text class="tiny" x="28" y="114" fill="#db2777">QUE MIDE?</text>
    <text class="label ink" x="28" y="148">Exito</text>
    <text class="small muted" x="28" y="178">Recompensa guia;</text>
    <text class="small muted" x="28" y="202">limpiar decide.</text>
  </g>

  <g transform="translate(630 140)">
    <rect width="250" height="210" rx="24" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <text class="big" x="28" y="78" fill="#047857">3</text>
    <text class="tiny" x="28" y="114" fill="#047857">DONDE EXAMINA?</text>
    <text class="label ink" x="28" y="148">Split</text>
    <text class="small muted" x="28" y="178">Train no puede</text>
    <text class="small muted" x="28" y="202">contaminar test.</text>
  </g>

  <g transform="translate(910 140)">
    <rect width="250" height="210" rx="24" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <text class="big" x="28" y="78" fill="#c2410c">4</text>
    <text class="tiny" x="28" y="114" fill="#c2410c">CUANTO AZAR?</text>
    <text class="label ink" x="28" y="148">Semillas</text>
    <text class="small muted" x="28" y="178">Media y dispersion,</text>
    <text class="small muted" x="28" y="202">no mejor run.</text>
  </g>

  <g transform="translate(130 430)">
    <rect width="940" height="106" rx="26" fill="#ecfeff" stroke="#bae6fd" class="shadow"/>
    <text class="tiny" x="34" y="36" fill="#0e7490">TESIS DE LA PARTE I</text>
    <text class="label ink" x="34" y="70">La formulacion puso el techo.</text>
    <text class="small muted" x="34" y="96">El algoritmo solo pudo subir cuando el techo dejo de estar cerrado.</text>
  </g>

  <g transform="translate(212 600)">
    <rect width="776" height="68" rx="34" fill="#111827"/>
    <text class="body" x="388" y="30" text-anchor="middle" fill="#fff">Siguiente paso: abrir las piezas internas.</text>
    <text class="small" x="388" y="52" text-anchor="middle" fill="#cbd5e1">Q(s,a), politica pi, gamma, replay, actor-critico y modelos del mundo.</text>
  </g>
</svg>
