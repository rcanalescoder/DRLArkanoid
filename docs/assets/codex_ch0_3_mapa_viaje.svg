<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Mapa visual del viaje del laboratorio</title>
  <desc id="desc">Ruta del libro desde el problema inicial hasta el resultado evaluado, con seis tramos y una pregunta guia por tramo.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="820"/>
  <text class="title ink" x="48" y="58">El mapa del laboratorio: seis tramos, una tesis</text>
  <text class="body muted" x="48" y="88">Antes de entrar en detalles, ubica que responde cada parte y que prueba realmente el resultado final.</text>

  <rect x="72" y="126" width="1056" height="104" rx="28" fill="#f8fafc" stroke="#dbe2ea" class="shadow"/>
  <text class="tiny muted" x="112" y="164">PREGUNTA CENTRAL</text>
  <text class="label ink" x="112" y="195">Cuando un agente falla, el problema es el algoritmo o como hemos descrito el mundo?</text>
  <rect x="862" y="156" width="210" height="44" rx="18" fill="#111827"/>
  <text class="mono" x="967" y="183" text-anchor="middle" fill="#fff">formular bien la tarea</text>

  <g transform="translate(58 292)">
    <rect width="160" height="208" rx="22" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <circle cx="80" cy="46" r="24" fill="#f97316"/>
    <text class="label" x="80" y="53" text-anchor="middle" fill="#fff">1</text>
    <text class="tiny" x="80" y="88" text-anchor="middle" fill="#c2410c">HISTORIA</text>
    <text class="label ink" x="80" y="118" text-anchor="middle">El fallo</text>
    <text class="small muted" x="80" y="146" text-anchor="middle">agente ciego</text>
    <text class="small muted" x="80" y="166" text-anchor="middle">6 numeros</text>
    <text class="mono" x="80" y="192" text-anchor="middle" fill="#c2410c">0% dispersos</text>
  </g>

  <g transform="translate(238 292)">
    <rect width="160" height="208" rx="22" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <circle cx="80" cy="46" r="24" fill="#2563eb"/>
    <text class="label" x="80" y="53" text-anchor="middle" fill="#fff">2</text>
    <text class="tiny" x="80" y="88" text-anchor="middle" fill="#1d4ed8">FUNDAMENTOS</text>
    <text class="label ink" x="80" y="118" text-anchor="middle">El idioma</text>
    <text class="small muted" x="80" y="146" text-anchor="middle">estado, accion,</text>
    <text class="small muted" x="80" y="166" text-anchor="middle">recompensa</text>
    <text class="mono" x="80" y="192" text-anchor="middle" fill="#1d4ed8">s -> a -> r -> s'</text>
  </g>

  <g transform="translate(418 292)">
    <rect width="160" height="208" rx="22" fill="#ecfeff" stroke="#a5f3fc" class="shadow"/>
    <circle cx="80" cy="46" r="24" fill="#0891b2"/>
    <text class="label" x="80" y="53" text-anchor="middle" fill="#fff">3</text>
    <text class="tiny" x="80" y="88" text-anchor="middle" fill="#0e7490">LABORATORIO</text>
    <text class="label ink" x="80" y="118" text-anchor="middle">La tarea</text>
    <text class="small muted" x="80" y="146" text-anchor="middle">86 numeros</text>
    <text class="small muted" x="80" y="166" text-anchor="middle">reloj justo</text>
    <text class="mono" x="80" y="192" text-anchor="middle" fill="#0e7490">8x10 ladrillos</text>
  </g>

  <g transform="translate(598 292)">
    <rect width="160" height="208" rx="22" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
    <circle cx="80" cy="46" r="24" fill="#7c3aed"/>
    <text class="label" x="80" y="53" text-anchor="middle" fill="#fff">4</text>
    <text class="tiny" x="80" y="88" text-anchor="middle" fill="#6d28d9">ALGORITMOS</text>
    <text class="label ink" x="80" y="118" text-anchor="middle">Cinco modos</text>
    <text class="small muted" x="80" y="146" text-anchor="middle">DQN, PPO, SAC,</text>
    <text class="small muted" x="80" y="166" text-anchor="middle">WM y WM-RNN</text>
    <text class="mono" x="80" y="192" text-anchor="middle" fill="#6d28d9">misma pista</text>
  </g>

  <g transform="translate(778 292)">
    <rect width="160" height="208" rx="22" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <circle cx="80" cy="46" r="24" fill="#0f9f6e"/>
    <text class="label" x="80" y="53" text-anchor="middle" fill="#fff">5</text>
    <text class="tiny" x="80" y="88" text-anchor="middle" fill="#047857">MEDICION</text>
    <text class="label ink" x="80" y="118" text-anchor="middle">El examen</text>
    <text class="small muted" x="80" y="146" text-anchor="middle">splits fijos</text>
    <text class="small muted" x="80" y="166" text-anchor="middle">5 semillas</text>
    <text class="mono" x="80" y="192" text-anchor="middle" fill="#047857">test no visto</text>
  </g>

  <g transform="translate(958 292)">
    <rect width="160" height="208" rx="22" fill="#f8fafc" stroke="#cbd5e1" class="shadow"/>
    <circle cx="80" cy="46" r="24" fill="#334155"/>
    <text class="label" x="80" y="53" text-anchor="middle" fill="#fff">6</text>
    <text class="tiny" x="80" y="88" text-anchor="middle" fill="#334155">CODIGO</text>
    <text class="label ink" x="80" y="118" text-anchor="middle">Reproducir</text>
    <text class="small muted" x="80" y="146" text-anchor="middle">red, bucle,</text>
    <text class="small muted" x="80" y="166" text-anchor="middle">ledger</text>
    <text class="mono" x="80" y="192" text-anchor="middle" fill="#334155">abrir y auditar</text>
  </g>

  <path d="M218,396 H232" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M398,396 H412" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M578,396 H592" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M758,396 H772" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M938,396 H952" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="112" y="572" width="976" height="132" rx="28" fill="#ffffff" stroke="#dbe2ea" class="shadow"/>
  <text class="tiny muted" x="154" y="612">LECTURA CORRECTA DEL TITULAR</text>
  <text class="label ink" x="154" y="646">El 91% no es una promesa universal: es un resultado condicionado.</text>
  <g transform="translate(154 666)">
    <rect width="146" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="mono" x="73" y="22" text-anchor="middle" fill="#1d4ed8">PPO</text>
    <rect x="164" width="146" height="34" rx="17" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text class="mono" x="237" y="22" text-anchor="middle" fill="#047857">TEST-ID</text>
    <rect x="328" width="146" height="34" rx="17" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text class="mono" x="401" y="22" text-anchor="middle" fill="#6d28d9">5 semillas</text>
    <rect x="492" width="146" height="34" rx="17" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="mono" x="565" y="22" text-anchor="middle" fill="#c2410c">1.5M pasos</text>
    <rect x="656" width="146" height="34" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="mono" x="729" y="22" text-anchor="middle" fill="#334155">split fijo</text>
  </g>

  <rect x="172" y="744" width="856" height="38" rx="19" fill="#111827"/>
  <text class="body" x="600" y="769" text-anchor="middle" fill="#fff">La ruta completa ensena a separar tres cosas: tarea, algoritmo y evidencia.</text>
</svg>
