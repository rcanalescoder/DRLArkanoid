<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Shaping como balanza entre proxy y objetivo</title>
  <desc id="desc">El shaping Phi premia un proxy facil y desvía al agente de limpiar el nivel; quitarlo mejora ocho puntos.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .num{font:900 42px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">Muro 2: una ayuda mal elegida puede ganar la partida equivocada</text>
  <text class="body muted" x="48" y="88">Phi no era malicioso: premiaba un proxy facil, y el agente lo optimizo con obediencia.</text>

  <g transform="translate(74 148)">
    <rect width="310" height="300" rx="24" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#6d28d9">SENAL FACIL</text>
    <text class="label ink" x="32" y="78">Acercar pala a bola</text>
    <text class="small muted" x="32" y="116">Da recompensa frecuente.</text>
    <text class="small muted" x="32" y="140">Se aprende rapido.</text>
    <g transform="translate(76 178)">
      <rect x="0" y="54" width="160" height="18" rx="9" fill="#111827"/>
      <circle cx="62" cy="34" r="14" fill="#ef4444"/>
      <rect x="48" y="88" width="70" height="18" rx="9" fill="#7c3aed"/>
      <path d="M62 48 L84 88" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <path d="M410 300 C455 300 470 300 518 300" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(446 148)">
    <rect width="310" height="300" rx="24" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#c2410c">OPTIMO COMODO</text>
    <text class="label ink" x="32" y="78">Seguir y sobrevivir</text>
    <text class="small muted" x="32" y="116">La recompensa sube.</text>
    <text class="small muted" x="32" y="140">El muro no se limpia.</text>
    <g transform="translate(36 184)">
      <rect width="238" height="36" rx="18" fill="#ffedd5"/>
      <rect width="178" height="36" rx="18" fill="#f59e0b"/>
      <text class="small" x="119" y="24" text-anchor="middle" fill="#7c2d12">recompensa visible</text>
      <rect y="54" width="238" height="36" rx="18" fill="#fee2e2"/>
      <rect y="54" width="68" height="36" rx="18" fill="#ef4444"/>
      <text class="small" x="119" y="78" text-anchor="middle" fill="#7f1d1d">exito real bajo</text>
    </g>
  </g>

  <path d="M782 300 C827 300 842 300 890 300" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(818 148)">
    <rect width="310" height="300" rx="24" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <text class="tiny" x="32" y="42" fill="#047857">ABLACION</text>
    <text class="label ink" x="32" y="78">Quitar Phi</text>
    <text class="small muted" x="32" y="116">La guia desaparece.</text>
    <text class="small muted" x="32" y="140">Manda la meta limpia.</text>
    <text class="num" x="32" y="224" fill="#047857">+8,0</text>
    <text class="label ink" x="142" y="218">puntos</text>
    <text class="small muted" x="32" y="256">de exito al retirar</text>
    <text class="small muted" x="32" y="278">el ingrediente.</text>
  </g>

  <g transform="translate(178 520)">
    <rect width="844" height="76" rx="22" fill="#111827"/>
    <text class="body" x="422" y="32" text-anchor="middle" fill="#fff">Lectura correcta: si quitar una ayuda mejora el resultado, esa ayuda estaba desviando la tarea.</text>
    <text class="small" x="422" y="56" text-anchor="middle" fill="#cbd5e1">Recompensa alta no prueba buen juego: pregunta siempre que termino esta premiando.</text>
  </g>
</svg>
