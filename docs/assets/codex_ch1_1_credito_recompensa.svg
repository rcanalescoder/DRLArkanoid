<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Recompensa escasa y asignacion de credito</title>
  <desc id="desc">Linea temporal de diez pasos donde la mayoria de recompensas son cero y el castigo llega tarde respecto a la accion que lo causo.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .mono{font:700 13px "SFMono-Regular",Menlo,Consolas,monospace}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="48" y="58">Dos dificultades escondidas en una partida</text>
  <text class="body muted" x="48" y="88">El agente recibe poca senal y, cuando llega, a veces llega tarde respecto a la causa.</text>

  <rect x="72" y="142" width="1056" height="300" rx="30" fill="#ffffff" stroke="#dbe2ea" class="shadow"/>
  <text class="tiny muted" x="112" y="184">DIEZ PASOS VISTOS COMO LINEA TEMPORAL</text>
  <line x1="130" y1="284" x2="1070" y2="284" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <g class="step" transform="translate(130 284)">
    <circle r="19" fill="#e2e8f0"/><text class="mono" y="5" text-anchor="middle" fill="#334155">1</text>
    <text class="mono" y="58" text-anchor="middle" fill="#64748b">0</text>
  </g>
  <g transform="translate(234 284)">
    <circle r="19" fill="#e2e8f0"/><text class="mono" y="5" text-anchor="middle" fill="#334155">2</text>
    <text class="mono" y="58" text-anchor="middle" fill="#64748b">0</text>
  </g>
  <g transform="translate(338 284)">
    <circle r="23" fill="#fef3c7" stroke="#f59e0b"/><text class="mono" y="5" text-anchor="middle" fill="#92400e">3</text>
    <text class="mono" y="62" text-anchor="middle" fill="#92400e">+0.2</text>
    <text class="small" y="-44" text-anchor="middle" fill="#92400e">rebote</text>
  </g>
  <g transform="translate(442 284)">
    <circle r="19" fill="#e2e8f0"/><text class="mono" y="5" text-anchor="middle" fill="#334155">4</text>
    <text class="mono" y="58" text-anchor="middle" fill="#64748b">0</text>
  </g>
  <g transform="translate(546 284)">
    <circle r="23" fill="#d1fae5" stroke="#0f9f6e"/><text class="mono" y="5" text-anchor="middle" fill="#047857">5</text>
    <text class="mono" y="62" text-anchor="middle" fill="#047857">+1.0</text>
    <text class="small" y="-44" text-anchor="middle" fill="#047857">ladrillo</text>
  </g>
  <g transform="translate(650 284)">
    <circle r="19" fill="#e2e8f0"/><text class="mono" y="5" text-anchor="middle" fill="#334155">6</text>
    <text class="mono" y="58" text-anchor="middle" fill="#64748b">0</text>
  </g>
  <g transform="translate(754 284)">
    <circle r="23" fill="#fee2e2" stroke="#fca5a5"/><text class="mono" y="5" text-anchor="middle" fill="#991b1b">7</text>
    <text class="mono" y="62" text-anchor="middle" fill="#64748b">0</text>
    <text class="small" y="-44" text-anchor="middle" fill="#991b1b">error</text>
  </g>
  <g transform="translate(858 284)">
    <circle r="19" fill="#e2e8f0"/><text class="mono" y="5" text-anchor="middle" fill="#334155">8</text>
    <text class="mono" y="58" text-anchor="middle" fill="#64748b">0</text>
  </g>
  <g transform="translate(962 284)">
    <circle r="23" fill="#fecaca" stroke="#dc2626"/><text class="mono" y="5" text-anchor="middle" fill="#991b1b">9</text>
    <text class="mono" y="62" text-anchor="middle" fill="#991b1b">-1.0</text>
    <text class="small" y="-44" text-anchor="middle" fill="#991b1b">castigo</text>
  </g>
  <g transform="translate(1066 284)">
    <circle r="19" fill="#e2e8f0"/><text class="mono" y="5" text-anchor="middle" fill="#334155">10</text>
    <text class="mono" y="58" text-anchor="middle" fill="#64748b">0</text>
  </g>

  <path d="M754,220 C820,170 930,174 962,220" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text class="small" x="858" y="168" text-anchor="middle" fill="#991b1b">la causa probable esta antes</text>

  <rect x="120" y="486" width="442" height="160" rx="26" fill="#f8fafc" stroke="#dbe2ea" class="shadow"/>
  <text class="tiny" x="158" y="526" fill="#334155">DIFICULTAD 1</text>
  <text class="label ink" x="158" y="558">Recompensa escasa</text>
  <text class="small muted" x="158" y="590">En la tabla, siete de diez pasos</text>
  <text class="small muted" x="158" y="612">dan cero. El agente actua mucho</text>
  <text class="small muted" x="158" y="634">y recibe nota muy pocas veces.</text>

  <rect x="638" y="486" width="442" height="160" rx="26" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
  <text class="tiny" x="676" y="526" fill="#c2410c">DIFICULTAD 2</text>
  <text class="label ink" x="676" y="558">Asignacion de credito</text>
  <text class="small muted" x="676" y="590">El -1 llega en el paso 9, pero</text>
  <text class="small muted" x="676" y="612">la mala decision empezo en el 7.</text>
  <text class="small muted" x="676" y="634">Hay que repartir culpa hacia atras.</text>

  <rect x="204" y="674" width="792" height="42" rx="21" fill="#111827"/>
  <text class="body" x="600" y="702" text-anchor="middle" fill="#fff">La recompensa no cuenta la historia completa; solo deja pistas temporales.</text>
</svg>
