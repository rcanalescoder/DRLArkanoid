<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Resumen visual del agente ciego</title>
  <desc id="desc">Resumen del capitulo: el agente ciego veia seis cinematicos, no veia ladrillos, sobrevivir parecia exito y el arreglo era reformular.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}
      .title{font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.45px}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title ink" x="48" y="58">Cierre de 1.4: el fracaso tenia forma, no misterio</text>
  <text class="body muted" x="48" y="88">El agente no era tonto: estaba resolviendo el problema incompleto que le dimos.</text>

  <g transform="translate(84 148)">
    <rect width="310" height="160" rx="24" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
    <text class="tiny" x="34" y="40" fill="#1d4ed8">1 - ENTRADA</text>
    <text class="label ink" x="34" y="72">Solo seis numeros</text>
    <text class="small muted" x="34" y="106">Bola, velocidad y pala.</text>
    <text class="small muted" x="34" y="126">Nada sobre ladrillos.</text>
  </g>
  <g transform="translate(445 148)">
    <rect width="310" height="160" rx="24" fill="#ecfdf5" stroke="#bbf7d0" class="shadow"/>
    <text class="tiny" x="34" y="40" fill="#047857">2 - CONDUCTA</text>
    <text class="label ink" x="34" y="72">Sobrevive bien</text>
    <text class="small muted" x="34" y="106">Devuelve la bola.</text>
    <text class="small muted" x="34" y="126">No elige objetivo.</text>
  </g>
  <g transform="translate(806 148)">
    <rect width="310" height="160" rx="24" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
    <text class="tiny" x="34" y="40" fill="#c2410c">3 - TRAMPA</text>
    <text class="label ink" x="34" y="72">56% enganoso</text>
    <text class="small muted" x="34" y="106">Solo en muro lleno.</text>
    <text class="small muted" x="34" y="126">Fisica, no punteria.</text>
  </g>

  <g transform="translate(220 374)">
    <rect width="340" height="164" rx="24" fill="#fef2f2" stroke="#fecaca" class="shadow"/>
    <text class="tiny" x="34" y="42" fill="#dc2626">4 - DIAGNOSTICO</text>
    <text class="label ink" x="34" y="74">Techo de informacion</text>
    <text class="small muted" x="34" y="108">Mas pasos no crean el muro</text>
    <text class="small muted" x="34" y="128">que falta en la observacion.</text>
  </g>

  <g transform="translate(640 374)">
    <rect width="340" height="164" rx="24" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
    <text class="tiny" x="34" y="42" fill="#6d28d9">5 - ARREGLO</text>
    <text class="label ink" x="34" y="74">Reformular la tarea</text>
    <text class="small muted" x="34" y="108">Dar matriz de ladrillos</text>
    <text class="small muted" x="34" y="128">y reloj proporcional.</text>
  </g>

  <rect x="222" y="620" width="756" height="48" rx="24" fill="#111827"/>
  <text class="body" x="600" y="651" text-anchor="middle" fill="#fff">La solucion no era entrenar mas: era mostrar el objetivo y cerrar el atajo.</text>
</svg>
