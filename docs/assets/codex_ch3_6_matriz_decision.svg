<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Matriz practica para elegir familia</title>
<desc id="desc">No hay un ganador universal: eliges segun estabilidad, datos y objetivo didactico.</desc>
<defs>
    <style>
      .bg{fill:#fff}.ink{fill:#111827}.muted{fill:#64748b}.line{stroke:#dbe2ea}.white{fill:#fff}
      .title{font:800 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .tiny{font:800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.35px}
      .num{font:900 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker>
  </defs>
<rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="52" y="58">Matriz practica para elegir familia</text>
  <text class="body muted" x="52" y="88">No hay un ganador universal: eliges segun estabilidad, datos y objetivo didactico.</text>

<g transform="translate(67 140)">
<rect width="250" height="310" rx="22" fill="#f5f3ff" stroke="#ddd6fe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#7c3aed">BUSCAS</text>
<text class="label ink" x="24" y="68">Fiabilidad</text>
<text class="small muted" x="24" y="108">PPO suele ser una primera</text>
<text class="small muted" x="24" y="130">lectura robusta si puedes</text>
<text class="small muted" x="24" y="152">pagar datos frescos</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#7c3aed"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">PPO</text>
</g>
<g transform="translate(339 140)">
<rect width="250" height="310" rx="22" fill="#eff6ff" stroke="#bfdbfe" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#2563eb">BUSCAS</text>
<text class="label ink" x="24" y="68">Base interpretable</text>
<text class="small muted" x="24" y="108">DQN deja ver Q(s,a),</text>
<text class="small muted" x="24" y="130">replay y Bellman con</text>
<text class="small muted" x="24" y="152">claridad</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#2563eb"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">DQN</text>
</g>
<g transform="translate(611 140)">
<rect width="250" height="310" rx="22" fill="#fdf2f8" stroke="#fbcfe8" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#db2777">BUSCAS</text>
<text class="label ink" x="24" y="68">Exploracion rica</text>
<text class="small muted" x="24" y="108">SAC controla diversidad</text>
<text class="small muted" x="24" y="130">con entropia y</text>
<text class="small muted" x="24" y="152">temperatura</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#db2777"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">SAC</text>
</g>
<g transform="translate(883 140)">
<rect width="250" height="310" rx="22" fill="#fff7ed" stroke="#fed7aa" class="shadow"/>
<text class="tiny" x="24" y="34" fill="#d97706">BUSCAS</text>
<text class="label ink" x="24" y="68">Practicar en maqueta</text>
<text class="small muted" x="24" y="108">World Model sirve si el</text>
<text class="small muted" x="24" y="130">modelo es suficientemente</text>
<text class="small muted" x="24" y="152">fiel</text>
<rect x="24" y="252" width="202" height="38" rx="19" fill="#d97706"/>
<text class="small" x="125" y="276" text-anchor="middle" fill="#fff">WM</text>
</g>
<rect x="210" y="650" width="780" height="54" rx="27" fill="#111827"/>
<text class="body" x="600" y="683" text-anchor="middle" fill="#fff">La comparacion sana empieza por saber que tradeoff te importa.</text>
</svg>
